<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Exam Practice</title>
<meta name="description" content="Practice questions with explanations: JavaScript, React basics, terminal commands, FastAPI and SQLAlchemy.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<!-- React + Babel run the React answers; Python (Pyodide) loads only when a Python question opens. -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js" crossorigin="anonymous"></script>
<style>
:root {
  --paper: #f7f8f6; --card: #ffffff; --ink: #17201d; --muted: #5d6965; --line: #dfe5e2; --soft: #eef2f0;
  --accent: #0f7a5c; --accent-soft: #e3f3ec; --hint: #b86a00; --hint-soft: #fff3df;
  --good: #158a4a; --good-soft: #e3f6ea; --bad: #c2362f; --bad-soft: #fde8e6;
  --code-bg: #111816; --code-2: #18211e;
  --t-js: #b8860b; --t-react: #1f7fae; --t-terminal: #4b5563; --t-fastapi: #0f8a74; --t-sqlalchemy: #b4442f;
  --f-head: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "Instrument Sans", "Segoe UI", system-ui, sans-serif;
  --f-code: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--paper); color: var(--ink); font: 16px/1.55 var(--f-body); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
a { color: var(--accent); }
code { font-family: var(--f-code); font-size: .88em; background: var(--soft); padding: 1px 5px; border-radius: 4px; }
h1, h2, h3 { font-family: var(--f-head); letter-spacing: -.01em; }

/* header */
.top { position: sticky; top: 0; z-index: 20; background: var(--card); border-bottom: 1px solid var(--line); }
.top-in { max-width: 1500px; margin: 0 auto; padding: 10px 16px; display: flex; gap: 10px 18px; align-items: center; flex-wrap: wrap; }
.brand { font: 800 1.25rem var(--f-head); margin-right: auto; display: flex; align-items: center; gap: 10px; }
.brand span { color: var(--accent); }
.overall { display: flex; align-items: center; gap: 10px; font-size: .9rem; color: var(--muted); }
.overall .bar { width: 140px; }
.bar { height: 8px; border-radius: 4px; background: var(--soft); overflow: hidden; display: block; }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: 4px; transition: width .3s; }
.btn { border: 0; border-radius: 10px; padding: 9px 16px; font-weight: 700; background: var(--accent); color: #fff; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.ghost { background: transparent; color: var(--ink); border: 1.5px solid var(--line); }
.btn.ghost:hover:not(:disabled) { border-color: var(--muted); }
.btn.small { padding: 6px 12px; font-size: .88rem; border-radius: 8px; }
.btn.dark { background: var(--ink); }
.linkbtn { border: 0; background: none; color: var(--accent); font-weight: 600; padding: 0; text-decoration: underline; }

/* layout */
.layout { max-width: 1500px; margin: 0 auto; padding: 16px; display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 1000px) { .layout { grid-template-columns: 330px minmax(0, 1fr); align-items: start; } }
.side { display: grid; gap: 12px; min-width: 0; }
@media (min-width: 1000px) { .side { position: sticky; top: 76px; max-height: calc(100vh - 92px); overflow-y: auto; overscroll-behavior: contain; } }
.panel { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; min-width: 0; }
.panel h3 { font: 700 .74rem var(--f-body); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; display: flex; justify-content: space-between; align-items: center; }
.panel h3 + .chips { margin-bottom: 12px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1.5px solid var(--line); background: var(--card); border-radius: 999px; padding: 4px 11px; font-size: .86rem; font-weight: 600; color: var(--muted); display: inline-flex; gap: 6px; align-items: center; }
.chip[aria-pressed="true"] { border-color: var(--ink); color: var(--ink); background: var(--soft); }
.chip .n { font: 600 .74rem var(--f-code); opacity: .8; }
.chip .dot { width: 9px; height: 9px; border-radius: 50%; }
.topics { display: grid; gap: 6px; margin-bottom: 12px; }
.topic { display: grid; grid-template-columns: 18px minmax(0, 1fr) auto; gap: 3px 8px; align-items: center; border: 1.5px solid var(--line); border-radius: 10px; padding: 5px 10px 6px; background: var(--card); text-align: left; }
.topic[aria-pressed="true"] { border-color: var(--ink); background: var(--soft); }
.topic[aria-pressed="false"] { opacity: .6; }
.topic .box { width: 16px; height: 16px; border-radius: 4px; border: 2px solid var(--muted); display: grid; place-items: center; font-size: 11px; color: #fff; }
.topic[aria-pressed="true"] .box { background: var(--ink); border-color: var(--ink); }
.topic b { font-size: .92rem; }
.topic .cnt { font: 600 .76rem var(--f-code); color: var(--muted); }
.topic .bar { grid-column: 2 / 4; height: 4px; }
@media (max-width: 640px) { .brand small { display: none; } }
.notes-link { grid-column: 2 / 4; font-size: .8rem; }
.search { width: 100%; padding: 8px 12px; border: 1.5px solid var(--line); border-radius: 10px; background: #fff; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.qlist-panel { display: grid; grid-template-rows: auto minmax(0, 1fr); padding: 10px 6px 6px 10px; min-height: 0; }
.qlist-head { display: flex; justify-content: space-between; align-items: center; padding: 0 6px 6px 2px; font-size: .86rem; color: var(--muted); }
.qlist { list-style: none; margin: 0; padding: 0 4px 0 0; overflow: auto; max-height: 55vh; }
.qlist li button { width: 100%; text-align: left; display: grid; grid-template-columns: 12px minmax(0, 1fr) auto; gap: 8px; align-items: center; border: 0; background: none; border-radius: 8px; padding: 6px 8px; }
.qlist li button:hover { background: var(--soft); }
.qlist li button.on { background: var(--accent-soft); }
.qlist .st { width: 10px; height: 10px; border-radius: 50%; border: 2px solid #b9c3bf; }
.qlist .st.c { background: var(--good); border-color: var(--good); }
.qlist .st.w { background: var(--bad); border-color: var(--bad); }
.qlist .tt { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: .9rem; }
.qlist .ty { font: 600 .68rem var(--f-code); color: var(--muted); text-transform: uppercase; }
.empty { color: var(--muted); padding: 12px 8px; font-size: .9rem; }
.mobile-toggle { display: none; }
@media (max-width: 999px) {
  .mobile-toggle { display: flex; }
  .side.collapsed .panel { display: none; }
}

/* question */
.card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 22px 24px; min-width: 0; }
@media (max-width: 560px) { .card { padding: 16px; } .layout { padding: 10px; } }
.qhead { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; color: var(--muted); font-size: .86rem; }
.tag { display: inline-flex; align-items: center; gap: 6px; border-radius: 6px; padding: 2px 9px; font-weight: 700; font-size: .74rem; letter-spacing: .04em; text-transform: uppercase; background: var(--soft); color: var(--ink); }
.tag .dot { width: 8px; height: 8px; border-radius: 50%; }
.tag.c { background: var(--good-soft); color: var(--good); }
.tag.w { background: var(--bad-soft); color: var(--bad); }
.card h2 { font-size: 1.6rem; line-height: 1.15; margin: 10px 0 12px; text-wrap: balance; }
.prompt p { margin: 0 0 10px; max-width: 78ch; }
.prompt ul, .prompt ol { margin: 0 0 10px; padding-left: 22px; }
.tip { background: var(--accent-soft); border-left: 4px solid var(--accent); border-radius: 8px; padding: 10px 14px; }
pre.show { margin: 8px 0 14px; background: var(--code-bg); color: #e6ece9; border-radius: 10px; padding: 14px 16px; font: 14px/1.6 var(--f-code); overflow-x: auto; white-space: pre; }
.t-s { color: #f2c879; } .t-k { color: #8fc7f0; font-weight: 600; } .t-n { color: #f29eb3; } .t-c { color: #6f7f79; font-style: italic; } .t-f { color: #a7e2bc; } .t-tag { color: #7fd1c7; }
.opts { display: grid; gap: 8px; margin: 6px 0 14px; }
.opt { display: flex; gap: 12px; align-items: flex-start; text-align: left; background: var(--card); border: 1.5px solid var(--line); border-radius: 10px; padding: 11px 14px; }
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt .l { flex: none; width: 26px; height: 26px; border-radius: 6px; display: grid; place-items: center; font: 700 .85rem var(--f-code); background: var(--soft); color: var(--muted); }
.opt .x { min-width: 0; overflow-wrap: anywhere; }
.opt .x code { background: none; padding: 0; }
.opt[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.opt[aria-pressed="true"] .l { background: var(--accent); color: #fff; }
.opt:disabled { cursor: default; }
.opt.right { border-color: var(--good); background: var(--good-soft); }
.opt.right .l { background: var(--good); color: #fff; }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt.wrong .l { background: var(--bad); color: #fff; }
pre.blanks input { font: 600 14px var(--f-code); background: #26332e; color: #fff; border: 1.5px dashed #6f8f84; border-radius: 5px; padding: 1px 6px; }
pre.blanks input:focus { outline: 2px solid #8fc7f0; border-style: solid; }
pre.blanks input.ok { border: 2px solid #5fd08f; background: #173326; }
pre.blanks input.no { border: 2px solid #ff8b80; background: #3a1d1a; }
pre.blanks .num { font-size: 11px; color: #8aa59b; vertical-align: super; margin-right: 1px; }
.actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 8px; }
.note { color: var(--muted); font-size: .9rem; }
.result { margin-top: 14px; border-radius: 10px; padding: 12px 16px; }
.result > b:first-child { display: block; margin-bottom: 2px; }
.result.good { background: var(--good-soft); }
.result.good > b:first-child { color: var(--good); }
.result.bad { background: var(--bad-soft); }
.result.bad > b:first-child { color: var(--bad); }
.result.info { background: var(--accent-soft); }
.result.info > b:first-child { color: var(--accent); }
.result p { margin: 4px 0 0; }
.hintbox { margin-top: 12px; }
.hintbtn { border: 1.5px dashed var(--hint); background: transparent; color: var(--hint); border-radius: 10px; padding: 6px 12px; font-weight: 600; font-size: .9rem; }
.hinttext { background: var(--hint-soft); border-left: 4px solid var(--hint); border-radius: 8px; padding: 10px 14px; }
.hinttext b { color: var(--hint); }
.qnav { display: flex; justify-content: space-between; gap: 10px; margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--line); flex-wrap: wrap; }

/* code bench */
.bench { margin-top: 14px; display: grid; gap: 12px; }
.editor { display: grid; grid-template-columns: 44px minmax(0, 1fr); background: var(--code-bg); border-radius: 12px; height: 360px; overflow: hidden; }
.gutter { font: 14px/1.6 var(--f-code); color: #4f615b; text-align: right; padding: 14px 10px 14px 0; overflow: hidden; user-select: none; background: var(--code-2); white-space: pre; }
.code-wrap { position: relative; min-width: 0; }
.code-wrap textarea, .code-wrap pre { position: absolute; inset: 0; margin: 0; border: 0; padding: 14px 16px; font: 14px/1.6 var(--f-code); tab-size: 4; white-space: pre; overflow: auto; letter-spacing: 0; }
.code-wrap pre { pointer-events: none; color: #e6ece9; scrollbar-width: none; }
.code-wrap pre::-webkit-scrollbar { display: none; }
.code-wrap textarea { background: transparent; color: transparent; caret-color: #f2c879; resize: none; outline: none; }
.code-wrap textarea::selection { background: rgba(143,199,240,.3); color: transparent; }
.code-wrap textarea[readonly] { caret-color: transparent; }
.stdin summary { cursor: pointer; font-weight: 600; color: var(--muted); }
.stdin textarea { width: 100%; margin-top: 6px; font: 14px/1.5 var(--f-code); padding: 8px 10px; border: 1.5px solid var(--line); border-radius: 10px; }
.panes { display: grid; gap: 12px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 1250px) { .panes.two { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } }
.pane { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; min-width: 0; background: var(--card); }
.pane h4 { margin: 0; padding: 8px 12px; font-size: .74rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); border-bottom: 1px solid var(--line); background: #fafbfa; }
.console { font: 13px/1.55 var(--f-code); padding: 10px 12px; height: 190px; overflow: auto; white-space: pre-wrap; overflow-wrap: anywhere; background: var(--code-bg); color: #e6ece9; }
.console .err { color: #ff9b91; } .console .info { color: #8a9c96; font-style: italic; } .console .cmd { color: #9fe0c4; font-weight: 600; margin-top: 4px; }
.preview { padding: 14px; min-height: 190px; max-height: 340px; overflow: auto; }
.preview img { max-width: 120px; }
.checks { list-style: none; margin: 0; padding: 10px 12px; display: grid; gap: 6px; }
.checks li { display: grid; grid-template-columns: 22px 1fr; gap: 6px; font-size: .93rem; }
.checks .i { font-weight: 700; font-family: var(--f-code); }
.checks .pass .i { color: var(--good); } .checks .fail .i { color: var(--bad); } .checks .wait .i { color: #a0aaa6; }
.checks .why { display: block; color: var(--bad); font-family: var(--f-code); font-size: .82rem; white-space: pre-wrap; }
.solution { margin-top: 4px; }
.solution h4 { margin: 10px 0 6px; font-size: .8rem; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }

/* notes + welcome */
.notes h2 { margin-top: 4px; }
.notes h3 { font-size: 1.1rem; margin: 22px 0 6px; }
.notes p, .notes li { max-width: 80ch; }
.welcome .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin: 16px 0; }
.welcome .stat { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: grid; gap: 6px; text-align: left; background: var(--card); }
.welcome .stat b { font: 800 1.1rem var(--f-head); }
.welcome .stat span { color: var(--muted); font-size: .86rem; }
.kbd { font: 600 .8rem var(--f-code); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 5px; padding: 0 5px; background: #fff; }
.toasts { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); display: grid; gap: 8px; z-index: 100; width: min(92vw, 520px); }
.toast { background: var(--ink); color: #fff; border-radius: 10px; padding: 10px 16px; font-weight: 600; box-shadow: 0 10px 30px rgba(0,0,0,.2); transition: opacity .3s, transform .3s; }
.toast.out { opacity: 0; transform: translateY(8px); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

.tablewrap { overflow-x: auto; margin: 6px 0 12px; }
table.md { border-collapse: collapse; font-size: .93rem; min-width: 60%; }
table.md th, table.md td { text-align: left; padding: 6px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
table.md th { font-size: .74rem; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.notes h2 { font-size: 1.7rem; }

/* ───── study notes navigation ───── */
.notes-nav ul { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; }
.notes-nav h3 a { color: inherit; text-decoration: none; }
.notes-nav h3 a:hover, .notes-nav h3 a:focus-visible { text-decoration: underline; }
.notes-nav ul a, .notes-tabs a { display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border: 1.5px solid var(--line); border-radius: 999px; font: 600 .84rem var(--f-body); color: var(--ink); text-decoration: none; background: #fff; }
.notes-nav ul a:hover, .notes-tabs a:hover { border-color: var(--ink); }
.notes-nav ul a[aria-current="page"], .notes-tabs a[aria-current="page"] { border-color: var(--ink); background: var(--ink); color: #fff; }
.notes-tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }
.toc { border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px; margin: 12px 0 8px; background: #fafbfa; }
.toc h3 { margin: 0 0 6px !important; font: 700 .74rem var(--f-body) !important; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.toc ol { margin: 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; gap: 6px 18px; }
.toc li { margin: 0; }
.sec-link { margin-left: 6px; color: var(--muted); text-decoration: none; font-weight: 400; opacity: .5; }
.sec-link:hover, .sec-link:focus-visible { opacity: 1; text-decoration: underline; }
.notes h3[tabindex]:focus { outline: none; }
.notes h3.flash { animation: flash 1.6s ease-out; border-radius: 6px; }
@keyframes flash { 0%, 30% { background: #fff3c4; box-shadow: 0 0 0 6px #fff3c4; } 100% { background: transparent; box-shadow: 0 0 0 6px transparent; } }
.sec-q { margin: -2px 0 10px; font-size: .88rem; }
.sec-q summary { cursor: pointer; color: var(--accent); font-weight: 600; width: fit-content; }
.sec-q ul { margin: 6px 0 0; padding-left: 20px; columns: 2 240px; }
.sec-q li { margin: 2px 0; break-inside: avoid; }
.result .more { margin: 10px 0 0; font-size: .9rem; }
.notes-index { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 8px 24px; }
.notes-index h3 a { display: inline-flex; align-items: center; gap: 8px; color: var(--ink); }
.notes-index ul { margin: 4px 0 12px; padding-left: 20px; }
.notes-index li { margin: 3px 0; }
@media (prefers-reduced-motion: reduce) { .notes h3.flash { animation: none; } }

/* ───── API docs (styled like Swagger UI at /docs) ───── */
[data-docs-pane] h4 { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.apidocs { padding: 12px; display: grid; gap: 10px; }
.ad-head { display: flex; justify-content: space-between; gap: 8px; }
.ad-badge { font: 700 .7rem var(--f-code); background: #89bf04; color: #fff; padding: 2px 6px; border-radius: 10px; vertical-align: middle; }
.apidocs details.op { border: 1px solid; border-radius: 6px; overflow: hidden; }
.apidocs details.op > summary { display: flex; align-items: center; gap: 12px; padding: 7px 10px; cursor: pointer; list-style: none; flex-wrap: wrap; }
.apidocs details.op > summary::-webkit-details-marker { display: none; }
.ad-m { min-width: 70px; text-align: center; font: 700 .85rem var(--f-code); color: #fff; padding: 5px 8px; border-radius: 4px; }
.ad-path { font: 600 .95rem var(--f-code); color: #3b4151; word-break: break-all; }
.ad-sum { color: #3b4151; font-size: .9rem; }
.op-body { padding: 10px 14px 14px; background: #fff; border-top: 1px solid var(--line); }
.op-body h5 { margin: 10px 0 6px; font-size: .85rem; }
.op-body textarea { width: 100%; font: .85rem var(--f-code); padding: 8px; border: 1.5px solid var(--line); border-radius: 6px; background: #41444e; color: #fff; }
.ad-params { width: 100%; border-collapse: collapse; font-size: .88rem; }
.ad-params th { text-align: left; font-size: .78rem; color: var(--muted); border-bottom: 1px solid var(--line); padding: 4px 6px; }
.ad-params td { vertical-align: top; padding: 6px; border-bottom: 1px solid var(--line); }
.ad-params input { width: 100%; max-width: 320px; padding: 6px 8px; border: 1.5px solid var(--line); border-radius: 6px; font: .9rem var(--f-code); }
.ad-params input.ad-missing { border-color: #f93e3e; background: #feebeb; }
.ad-req { color: #f93e3e; font-size: .72rem; margin-left: 6px; }
.ad-type { font: .78rem var(--f-code); color: var(--muted); }
.ad-in { font: italic .76rem var(--f-code); color: #808080; }
.ad-schema { margin-top: 6px; font: .82rem var(--f-code); color: #3b4151; }
.ad-pre, .ad-printed { background: #333; color: #fff; padding: 8px 10px; border-radius: 4px; font: .82rem var(--f-code); white-space: pre-wrap; word-break: break-word; margin: 0; max-height: 280px; overflow: auto; }
.ad-printed { background: #1e2a24; color: #cfe9dc; }
.ad-ok { color: #1a7f4b; } .ad-bad { color: #c2362f; }
.ad-err { white-space: pre-wrap; color: #c2362f; background: #feebeb; padding: 8px 10px; border-radius: 6px; font: .85rem var(--f-code); margin: 0; }
.op-get { border-color: #61affe !important; background: #ebf3fb; } .op-get .ad-m { background: #61affe; }
.op-post { border-color: #49cc90 !important; background: #e8f6f0; } .op-post .ad-m { background: #49cc90; }

nd(ColumnElement):\n    def __init__(self, fn, text, truth=None):\n        self.fn = fn\n        self.text = text\n        self._truth = truth\n\n    def __call__(self, row):\n        return self.fn(row)\n\n    def __bool__(self):\n        if self._truth is None:\n            raise TypeError(\"Boolean value of this clause is not defined\")\n        return self._truth\n\n    def __and__(self, other):\n        return and_(self, other)\n\n    def __or__(self, other):\n        return or_(self, other)\n\n    def __invert__(self):\n        return not_(self)\n\n    def __repr__(self):\n        return self.text\n\n\ndef _value(row, key):\n    return row.get(key)\n\n\ndef _like_regex(pattern, flags=0):\n    out = \"\"\n    for ch in pattern:\n        out += \".*\" if ch == \"%\" else \".\" if ch == \"_\" else re.escape(ch)\n    return re.compile(\"^\" + out + \"$\", flags | re.S)\n\n\nclass _Order:\n    def __init__(self, key, desc):\n        self.key = key\n        self.desc = desc\n\n\nclass InstrumentedAttribute:\n    def __init__(self, cls, key, column):\n        self.class_ = cls\n        self.key = key\n        self.column = column\n\n    # reading and writing on instances\n    def __get__(self, obj, owner=None):\n        if obj is None:\n            return self\n        st = _state(obj)\n        if st.expired:\n            st.session_refresh(obj)\n        return obj.__dict__.get(self.key)\n\n    def __set__(self, obj, value):\n        obj.__dict__[self.key] = value\n\n    # building conditions: Book.title == \"x\"\n    def _cmp(self, op, other, sym):\n        key = self.key\n        if isinstance(other, InstrumentedAttribute):\n            return _Cond(lambda r: op(r.get(key), r.get(other.key)), f\"{self} {sym} {other}\")\n        return _Cond(lambda r: r.get(key) is not None and other is not None and op(r.get(key), other),\n                     f\"{self} {sym} :param\")\n\n    def __eq__(self, other):\n        key = self.key\n        if other is None:\n            re self):\n        return _Order(self.key, True)\n\n    def asc(self):\n        return _Order(self.key, False)\n\n    def __repr__(self):\n        return f\"{self.class_.__tablename__}.{self.key}\"\n\n    __str__ = __repr__\n\n\ndef and_(*conds):\n    return _Cond(lambda r: all(c(r) for c in conds), \" AND \".join(map(repr, conds)))\n\n\ndef or_(*conds):\n    return _Cond(lambda r: any(c(r) for c in conds), \" OR \".join(map(repr, conds)))\n\n\ndef not_(cond):\n    return _Cond(lambda r: not cond(r), f\"NOT ({cond!r})\")\n\n\ndef desc(col):\n    return col.desc()\n\n\ndef asc(col):\n    return col.asc()\n\n\n# \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 tables, models \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n\n\nclass Table:\n    def __init__(self, name, columns, pk):\n        self.name = name\n        self.columns = columns\n        self.pk = pk\n\n    def __repr__(self):\n        return f\"Table('{self.name}')\"\n\n\nclass MetaData:\n    def __init__(self):\n        self.tables = {}\n\n    def create_all(self, bind, **kwargs):\n        if not isinstance(bind, Engine):\n            raise ArgumentError(\"create_all() needs the engine: Base.metadata.create_all(engine)\")\n        for name in self.tables:\n            bind._tables.setdefault(name, {})\n\n    def drop_all(self, bind, **kwargs):\n        for name in self.tables:\n            bind._tables.pop(name, None)\n\n\nclass _State:\n    def __init__(self, obj):\n        self.obj_ref = obj\n        self.session = None\n        self.key = None\n        self.snapshot = None\n        self.expired = False\n        self.deleted = False\n\n    def session_refresh(self, obj):\n        s = self.session\n        if s is None or self.key is None:\n            raise DetachedInstanceError(\n                f\"Instance {_short(obj)} is not bound to a Session; attribute refresh operation cannot proceed \"\n                f\"(Background on this error at: https://sqlalche.me/e/20/bhk3)\")\n        row = s._read_table(type(obj).__table__).get(self.key)\n        if row is None:\n            raise ObjectDeletedError(f\"Instance '{_short(obj)}' has been deleted, or its row is otherwise not present.\")\n        obj.__dict__.update(copy.deepcopy(row))\n        self.snapshot = copy.deepcopy(row)\n        self.expired = False\n\n\ndef _state(obj):\n    st = obj.__dict__.get(\"_sa_instance_state\")\n    if st is None:\n        st = _State(obj)\n        obj.__dict__[\"_sa_instance_state\"] = st\n    return st\n\n\ndef _mapped_state(obj):\n    if not hasattr(type(obj), \"__table__\") or not isinstance(getattr(type(obj), \"__table__\", None), Table):\n        raise UnmappedInstanceError(f\"Class '{type(obj).__module__}.{type(obj).__qualname__}' is not mapped\")\n    return _state(obj)\n\n\ndef _is_mapped_ann(tp):\n    return typing.get_origin(tp) is Mapped\n\n\ndef _inner(tp):\n    inner = typing.get_args(tp)[0] if typing.get_args(tp) else object\n    origin = typing.get_origin(inner)\n    optional = False\n    if origin is typing.Union or origin is types.UnionType:\n        args = typing.get_args(inner)\n        optional = type(None) in args\n        rest = [a for a in args if a is not type(None)]\n        inner = rest[0] if len(rest) == 1 else object\n    return inner, optional\n\n\ndef _declarative_init(self, **kwargs):\n    cls = type(self)\n    for key, value in kwargs.items():\n        if key not in cls.__table__.columns:\n            raise TypeError(f\"{key!r} is an invalid keyword argument for {cls.__name__}\")\n        setattr(self, key, value)\n\n\n_declarative_init.__name__ = _declarative_init.__qualname__ = \"__init__\"\n\n\ndef _map_class(cls):\n    if cls.__dict__.get(\"__abstract__\"):\n        return\n    tablename = cls.__dict__.get(\"__tablename__\")\n    if not tablename: e any primary key columns \"\n            f\"for mapped table '{tablename}'\")\n    cls.__table__ = Table(tablename, columns, pk)\n    for name, col in columns.items():\n        setattr(cls, name, InstrumentedAttribute(cls, name, col))\n    if \"__init__\" not in cls.__dict__:\n        cls.__init__ = _declarative_init\n    metadata = getattr(cls, \"metadata\", None)\n    if metadata is not None:\n        metadata.tables[tablename] = cls.__table__\n\n\nclass DeclarativeBase:\n    \"\"\"class Base(DeclarativeBase): pass\"\"\"\n\n    def __init_subclass__(cls, **kwargs):\n        super().__init_subclass__(**kwargs)\n        if DeclarativeBase in cls.__bases__:\n            cls.metadata = MetaData()\n            return\n        _map_class(cls)\n\n\ndef declarative_base(**kwargs):\n    return type(\"Base\", (DeclarativeBase,), {})\n\n\n# \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 engine \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n\n\nclass Engine:\n    def __init__(self, url, echo=False, **kwargs):\n        if not isinstance(url, str) or \"://\" not in url:\n            raise ArgumentError(f\"Could not parse SQLAlchemy URL from string '{url}'\")\n        self.url = url\n        self.echo = echo\n        self._tables = {}\n\n    def dispose(self):\n        pass\n\n    def connect(self):\n        raise NotImplementedError(\"This practice page works with Session(engine), not engine.connect().\")\n\n    def __repr__(self):\n        return f\"Engine({self.url})\"\n\n\ndef create_engine(url, **kwargs):\n    return Engine(url, **kwargs)\n\n\n# \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 statements and results \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n\n\nclass Select:\n    def __init__(self, *entities):\n        if not entities:\n            raise ArgumentError(\"select() needs something to select, e.g. select(Book)\")\n        self._entities = entities\n        self._where = []\n        self._order = []\n        self._limit = None\n        self._offset = 0\n\n    def _copy(self, **changes):\n        new = copy.copy(self)\n        new._where = list(self._where)\n        new._order = list(self._order)\n        for k, v in changes.items():\n            setattr(new, k, v)\n        return new\n\n    @property\n    def _cls(self):\n        e = self._entities[0]\n        if isinstance(e, InstrumentedAttribute):\n            return e.class_\n        if inspect.isclass(e) and isinstance(getattr(e, \"__table__\", None), Table):\n            return e\n        raise ArgumentError(f\"select() needs a model class or a column, got {e!r}\")\n\n    def where(self, *conds):\n        for c in conds:\n            if not isinstance(c, _Cond):\n                raise ArgumentError(\n                    f\"SQL expression element expected, got {c!r}. Write a comparison like Book.author == \\\"Narayan\\\".\")\n        new = self._copy()\n        new._where.extend(conds)\n        return new\n\n    filter = where\n\n    def filter_by(self, **kwargs):\n        cls = self._cls\n        conds = []\n        for k, v in kwargs.items():\n            if k not in cls.__table__.columns:\n                raise InvalidRequestError(f'Entity namespace for \"{cls.__tablename__}\" has no property \"{k}\"')\n            conds.append(getattr(cls, k) == v)\n        return self.where(*conds)\n\n    def order_by(self, *cols):\n        new = self._copy()\n        for c in cols:\n            new._order.append(c if isinstance(c, _Order) else _Order(c.key, False))\n        return new\n\n    def limit(self, n):\n        return self._copy(_limit=n)\n\n    def offset const uid = (n = 12) => {
  const a = "abcdefghijkmnpqrstuvwxyz23456789";
  const bytes = crypto.getRandomValues(new Uint8Array(n));
  return Array.from(bytes, b => a[b % a.length]).join("");
};

// "Priya  Rao" → "priya-rao". Keeps letters from any script.
const nameKey = name => String(name).normalize("NFKC").toLowerCase().trim().replace(/[^\p{L}\p{N}]+/gu, "-").replace(/^-+|-+$/g, "").slice(0, 60);

function debounce(fn, ms) {
  let t = null;
  const d = (...a) => { clearTimeout(t); t = setTimeout(() => { t = null; fn(...a); }, ms); };
  d.flush = (...a) => { clearTimeout(t); t = null; fn(...a); };
  d.cancel = () => { clearTimeout(t); t = null; };
  return d;
}

// Buttons that change things for everyone need a second click.
function confirmClick(btn, run, armedText = "Click again to confirm") {
  if (btn.dataset.armed) {
    delete btn.dataset.armed; btn.classList.remove("armed"); btn.textContent = btn.dataset.label; run(); return;
  }
  btn.dataset.label = btn.textContent; btn.dataset.armed = "1"; btn.classList.add("armed"); btn.textContent = armedText;
  setTimeout(() => { if (btn.dataset.armed) { delete btn.dataset.armed; btn.classList.remove("armed"); btn.textContent = btn.dataset.label; } }, 4000);
}

function download(name, text, type = "text/plain") {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([text], { type }));
  a.download = name;
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

const csvLine = vals => vals.map(v => `"${String(v ?? "").replace(/"/g, '""')}"`).join(",");

function toast(text, kind = "") {
  let box = document.getElementById("toasts");
  if (!box) { box = document.createElement("div"); box.id = "toasts"; box.className = "toasts"; box.setAttribute("aria-live", "polite"); document.body.append(box); }
  const t = document.createElement("div");
  t.className = "toast " + kind; t.textContent = text; box.append(t);
  setTimeout(() => { t.classList.add("out"); setTimeout(() => t.remove(), 300); }, kind === "err" ? 6000 : 3200);
}

async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; }
  catch {
    const t = document.createElement("textarea"); t.value = text; document.body.append(t); t.select();
    let ok = false; try { ok = document.execCommand("copy"); } catch {} t.remove(); return ok;
  }
}

function deepEqual(a, b) {
  if (Object.is(a, b)) return true;
  if (typeof a !== typeof b || a === null || b === null || typeof a !== "object") return false;
  if (Array.isArray(a) !== Array.isArray(b)) return false;
  const ka = Object.keys(a), kb = Object.keys(b);
  if (ka.length !== kb.length) return false;
  return ka.every(k => Object.prototype.hasOwnProperty.call(b, k) && deepEqual(a[k], b[k]));
}

// How a value looks in the console.
function fmt(v, top) {
  if (typeof v === "string") return top ? v : JSON.stringify(v);
  if (v === undefined) return "undefined";
  if (v === null) return "null";
  if (typeof v === "function") return `function ${v.name || ""}()`;
  if (v instanceof Error) return `${v.name}: ${v.message}`;
  if (Array.isArray(v)) return "[" + v.slice(0, 40).map(x => fmt(x)).join(", ") + (v.length > 40 ? ", …" : "") + "]";
  if (typeof v === "object") { try { return "{ " + Object.entries(v).slice(0, 20).map(([k, x]) => `${k}: ${fmt(x)}`).join(", ") + " }"; } catch { return String(v); } }
  return String(v);
}

const CLS = ["t-c", "t-s", "t-tag", "t-k", "t-n", "t-f"];

function highlight(src, lang = "js") {
  const re = lang === "python" ? PY : lang === "shell" || lang === "terminal" ? SH : lang === "text" ? null : JS;
  if (!re) return esc(src);
  re.lastIndex = 0;
  let out = "", last = 0, m;
  while ((m = re.exec(src))) {
    if (m[0] === "") { re.lastIndex++; continue; }
    out += esc(src.slice(last, m.index));
    let i = 1; while (i < m.length && m[i] === undefined) i++;
    const cls = lang === "python" && i === 3 ? "t-f" : lang !== "python" && lang !== "js" && lang !== "react" && i === 3 ? "t-f" : CLS[i - 1];
    out += `<span class="${cls}">${esc(m[0])}</span>`;
    last = re.lastIndex;
  }
  return out + esc(src.slice(last));
}

function inline(s) {

}

function markdown(src) {

  }

}

function createEditor(host, { value = "", lang = "js", readOnly = false, label = "Code", height, onChange, onCtrlEnter } = {}) {
  const indentUnit = lang === "python" ? "    " : "  ";
  host.innerHTML = `
    <div class="editor"${height ? ` style="height:${height}px"` : ""}>
      <div class="gutter" aria-hidden="true"></div>
      <div class="code-wrap"><pre aria-hidden="true"></pre><textarea spellcheck="false" autocapitalize="off" autocomplete="off" aria-label="${label}"></textarea></div>
    </div>`;
  const ta = host.querySelector("textarea"), hl = host.querySelector("pre"), gutter = host.querySelector(".gutter");
  ta.value = value; ta.readOnly = readOnly;
  const hlLang = lang === "react" ? "js" : lang === "terminal" ? "shell" : lang;
  const syncScroll = () => { hl.scrollTop = ta.scrollTop; hl.scrollLeft = ta.scrollLeft; gutter.scrollTop = ta.scrollTop; };
  const paint = () => {
    hl.innerHTML = highlight(ta.value, hlLang) + "\n ";
    gutter.textContent = Array.from({ length: ta.value.split("\n").length }, (_, i) => i + 1).join("\n");
    syncScroll();
  };
  const insert = t => {
    ta.focus();

  };
  ta.addEventListener("input", () => { paint(); onChange && onChange(ta.value); });
  ta.addEventListener("scroll", syncScroll);
  ta.addEventListener("keydown", e => {
    if ((e.ctrlKey || e.metaKey) && e.key === "Enter") { e.preventDefault(); onCtrlEnter && onCtrlEnter(); return; }
    if (ta.readOnly) return;
    if (e.key === "Tab" && !e.shiftKey && !e.ctrlKey && !e.altKey) { e.preventDefault(); insert(indentUnit); return; }
    if (e.key === "Enter" && !e.shiftKey && !e.ctrlKey && !e.metaKey && !e.altKey) {
      const before = ta.value.slice(0, ta.selectionStart), line = before.slice(before.lastIndexOf("\n") + 1);
      let ind = line.match(/^\s*/)[0];
      if (lang === "python" ? /:\s*(#.*)?$/.test(line) : /[{(\[>]\s*$/.test(line) && !/\/>\s*$/.test(line)) ind += indentUnit;

      if (/^\s{2,}$/.test(line)) { e.preventDefault(); ta.setSelectionRange(ta.selectionStart - 2, ta.selectionStart); insert("}"); }
    }
  });
  paint();
  return {
    get value() { return ta.value; },
    set value(v) { ta.value = v; paint(); },
    setReadOnly(b) { ta.readOnly = b; },
    focus() { ta.focus(); },
    textarea: ta,
  };
}

function mockFetch(reply, calls, status = 200, requests = []) {

// A question's `term` describes the computer:
//   tree   folders are objects; files are 1, or { $file: true, ... } with details:
//            package.json: { $file: true, scripts: ["dev", "build"] }   (default: dev, build, preview)
//            main.py:      { $file: true, vars: ["app"] }                (names defined in the file)
//            requirements.txt: { $file: true, packages: ["fastapi", "uvicorn"] }
//   start  the folder the terminal opens in, e.g. "Desktop" ("" = home)
//   global packages already installed outside any virtual environment (default none)
// After running, checks get a state object `s` with:
//   s.cwd ("Desktop/canteen"), s.exists(path), s.did(kind, test?) (index of the first matching event or -1),

  const pipTarget = () => (S.venv ? (S.venvPkgs[S.venv] ||= new Set()) : S.global);
  const prompt = () => (S.venv ? `(${S.venv.split("/").pop()}) ` : "") + `${where(S.cwd)} $`;
  const normPkg = p => p.toLowerCase().replace(/^["']|["']$/g, "").replace(/[=<>~]=?.*$/, "");
  function pipInstall(list) {
    const into = pipTarget(), added = [];
    for (let p of list) {
      p = normPkg(p);
      if (p === "fastapi[standard]") { ["fastapi", "uvicorn", "fastapi-cli"].forEach(x => { into.add(x); added.push(x); }); continue; }
      if (p === "uvicorn[standard]") p = "uvicorn";
      into.add(p); added.push(p);
    }
    say(`Successfully installed ${added.join(" ")}`);
    log("pip", { pkgs: added, venv: S.venv });
  }
  function startServer(kind, detail) {
    S.server = { kind, at: S.cwd.join("/"), ...detail };
    log(kind, detail);
  }

  const lines = String(code).split("\n").flatMap(l => l.split("&&")).map(l => l.trim().replace(/^\$\s+/, ""))
    .filter(l => l && !l.startsWith("#") && !l.startsWith("//"));
  for (const line of lines) {
    S.out.push({ kind: "cmd", text: `${prompt()} ${line}` });
    if (/^(\^c|ctrl\s*\+?\s*c)$/i.test(line)) {
      if (S.server) { say("Server stopped."); log("stop"); S.server = null; } else say("(Nothing is running.)", "info");
      continue;
    }
    if (S.server) { say("(The server is still running in this terminal. To stop it, type ^C on its own line, like pressing Ctrl + C.)", "info"); continue; }
    const words = line.split(/\s+/), cmd = words[0], args = words.slice(1), c = cmd.toLowerCase();

    if (c === "pwd") { say(where(S.cwd)); continue; }
    if (c === "clear" || c === "cls") { S.out.length = 0; continue; }
    if (c === "ls" || c === "dir") {
      const target = args.find(a => !a.startsWith("-"));
      const r = target ? resolve(target) : { parts: S.cwd };
      if (r.error) { err(`ls: ${r.error}`); continue; }
      const n = node(r.parts);
      say(isDir(n) ? listing(n) : r.parts[r.parts.length - 1]);
      continue;
    }
    if (c === "cd") {
      if (!args.length || args[0] === "~") { S.cwd = []; log("cd"); continue; }
      const r = resolve(args.join(" "));
      if (r.error) { err(`cd: ${r.error}\n→ In ${where(r.at || S.cwd)} there is: ${listing(node(r.at || S.cwd))}`); continue; }
      if (!isDir(node(r.parts))) { err(`cd: not a directory: ${args.join(" ")}`); continue; }
      S.cwd = r.parts; log("cd");
      continue;
    }
    if (c === "mkdir") {
      const p = args.includes("-p");
      for (const name of args.filter(a => !a.startsWith("-"))) {
        const segs = split(name);
        let parts = name.startsWith("~") ? [] : S.cwd.slice(), ok = true;
        for (let i = 0; i < segs.length; i++) {
          const dir = node(parts), seg = segs[i], k = findKey(dir, seg);
          if (seg === "..") { parts.pop(); continue; }
          if (k) {
            if (i === segs.length - 1 && !p) { err(`mkdir: ${name}: File exists`); ok = false; break; }
            parts.push(k); continue;
          }
          if (i < segs.length - 1 && !p) { err(`mkdir: ${name}: No such file or directory\n→ Make the outer folder first, or use mkdir -p`); ok = false; break; }
          dir[seg] = {}; parts.push(seg);
        }
        if (ok) log("mkdir", { path: parts.join("/") });
      }
      continue;
    }
    if (c === "touch") {
      for (const name of args) { const dir = here(); if (!findKey(dir, name)) dir[name] = 1; log("touch", { path: [...S.cwd, name].join("/") }); }
      continue;
    }
    if (c === "code") { say("(VS Code opens this folder.)", "info"); continue; }
    if (c === "cat") { const r = resolve(args[0] || ""); if (r.error) err(`cat: ${r.error}`); else say("(the file’s text)", "info"); continue; }

    // ── npm ──
    if (c === "npx" && /create-react-app/.test(line)) { err("create-react-app is no longer recommended.\n→ Make a React app with Vite:  npm create vite@latest my-app -- --template react"); continue; }
    if (c === "npm") {
      const sub = (args[0] || "").toLowerCase();
      const dir = here();
      if (sub === "create" || sub === "init" && /vite/.test(args[1] || "")) {
        if (!/^vite(@latest)?$/.test(args[1] || "")) { err(`npm create needs a tool name, like: npm create vite@latest my-app -- --template react`); continue; }
        const name = args.slice(2).find(a => !a.startsWith("-") && a !== "react" && a !== "react-ts");
        const tIdx = args.indexOf("--template"), template = tIdx > -1 ? args[tIdx + 1] : null;
        if (!name) { err("Add a project name:  npm create vite@latest my-app -- --template react"); continue; }
        if (findKey(dir, name)) { err(`Target directory "${name}" is not empty.`); continue; }
        dir[name] = { "package.json": { $file: true, scripts: ["dev", "build", "lint", "preview"] }, "index.html": 1, "vite.config.js": 1, src: { "App.jsx": 1, "main.jsx": 1 }, public: {} };
        say(`Scaffolding project in ${where([...S.cwd, name])}...\n\nDone. Now run:\n\n  cd ${name}\n  npm install\n  npm run dev`);
        log("vite-create", { name, template, path: [...S.cwd, name].join("/") });
        continue;
      }
      if (!pkgOf(dir) && ["install", "i", "run", "start", "ci"].includes(sub)) {
        err(`npm error code ENOENT\nnpm error Could not read package.json: no such file in ${where(S.cwd)}\n→ Are you inside the project’s folder? (ls shows what’s here)`);
        continue;
      }
      if (sub === "install" || sub === "i" || sub === "ci") {
        const pkgs = args.slice(1).filter(a => !a.startsWith("-"));
        dir.node_modules = dir.node_modules || {};
        say(pkgs.length ? `added ${pkgs.length + 3} packages in 2s` : "added 213 packages, and audited 214 packages in 9s\n\nfound 0 vulnerabilities");
        log(pkgs.length ? "npm-add" : "npm-install", { pkgs });
        continue;
      }
      if (sub === "run" || sub === "start") {
        const script = sub === "start" ? "start" : (args[1] || "");
        const scripts = scriptsOf(dir);
        if (!script) { say(`Scripts available in this project:\n  ${scripts.join("\n  ")}`); continue; }
        if (!scripts.includes(script)) {
          err(`npm error Missing script: "${script}"\n→ This project has: ${scripts.join(", ")}${script === "start" && scripts.includes("dev") ? ".  Vite apps start with npm run dev" : ""}`);
          continue;
        }
        if (!dir.node_modules) { err("sh: vite: command not found\n→ The packages aren’t installed yet. Run npm install first."); continue; }
        if (script === "build") { say("vite v6 building for production...\n✓ built in 1.2s"); log("npm-run", { script }); continue; }
        say("  VITE v6.0.0  ready in 412 ms\n\n  ➜  Local:   http://localhost:5173/\n  ➜  press h + enter to show help");
        startServer("npm-run", { script });
        continue;
      }
      err(`npm: "${args[0] || ""}" isn’t something this practice terminal knows. Try npm install, npm run dev, or npm create vite@latest`);
      continue;
    }

    // ── Python ──
    if ((c === "python" || c === "python3" || c === "py") && args[0] === "-m" && args[1] === "venv") {
      const name = args[2];
      if (!name) { err("usage: python -m venv NAME   (most people call it venv)"); continue; }
      here()[name] = { bin: { activate: 1, python: 1 }, Scripts: { activate: 1 }, lib: {}, "pyvenv.cfg": 1 };
      S.venvPkgs[[...S.cwd, name].join("/")] = new Set();
      log("venv-create", { path: [...S.cwd, name].join("/") });
      continue;
    }
    if ((c === "python" || c === "python3" || c === "py") && args[0] === "-m" && args[1] === "pip") {
      if (args[2] !== "install") { err("Try: python -m pip install fastapi uvicorn"); continue; }
      pipInstall(args.slice(3).filter(a => !a.startsWith("-")));
      continue;
    }
    if (c === "source" || c === "." || /activate$/i.test(c)) {
      const target = c === "source" || c === "." ? args[0] : cmd;
      if (!target || !/activate$/i.test(target)) { err("To turn on a virtual environment:  source venv/bin/activate  (Mac/Linux)  or  venv\\Scripts\\activate  (Windows)"); continue; }
      const r = resolve(target.replace(/^\.\//, "").replace(/^\.\\/, ""));
      if (r.error) { err(`${c === "source" ? "source: " : ""}no such file or directory: ${target}\n→ Is the virtual environment in this folder? Make it with python -m venv venv`); continue; }
      const vparts = r.parts.slice(0, -2);
      S.venv = vparts.join("/");
      S.venvPkgs[S.venv] ||= new Set();
      log("venv-activate", { path: S.venv });
      continue;
    }
    if (c === "deactivate") { if (S.venv) { S.venv = null; log("venv-deactivate"); } else err("deactivate: command not found"); continue; }
    if (c === "pip" || c === "pip3") {
      if (args[0] !== "install") { err(args[0] === "list" ? "" : "Try: pip install fastapi uvicorn"); if (args[0] === "list") say([...pipTarget()].join("\n") || "(nothing installed here yet)"); continue; }
      if (args[1] === "-r") {
        const r = resolve(args[2] || "");
        const f = r.parts && node(r.parts);
        if (r.error || !f) { err(`ERROR: Could not open requirements file: No such file or directory: '${args[2] || ""}'`); continue; }
        pipInstall((f && f.packages) || ["fastapi", "uvicorn", "sqlalchemy"]);
        continue;
      }
      const pkgs = args.slice(1).filter(a => !a.startsWith("-"));
      if (!pkgs.length) { err("ERROR: You must give at least one requirement to install"); continue; }
      pipInstall(pkgs);
      continue;
    }
    if (c === "uvicorn" || (c === "fastapi" && (args[0] === "dev" || args[0] === "run"))) {
      const pk = S.venv ? S.venvPkgs[S.venv] : S.global;
      const fastapiCli = c === "fastapi";
      if (fastapiCli ? !pk.has("fastapi-cli") : !pk.has("uvicorn")) {
        const how = fastapiCli ? 'pip install "fastapi[standard]"' : "pip install fastapi uvicorn";
        err(`zsh: command not found: ${c}\n→ ${S.venv ? "Install it in this virtual environment: " + how : "Is the virtual environment turned on (source venv/bin/activate)? Then " + how}`);
        continue;
      }
      let mod, varName = "app";
      if (fastapiCli) mod = (args[1] || "main.py").replace(/\.py$/, "");
      else {
        const target = args.find(a => !a.startsWith("-") && !/^\d+$/.test(a));
        if (!target) { err("Usage: uvicorn main:app --reload   (file name : app variable)"); continue; }
        if (!target.includes(":")) { err(`Error loading ASGI app. Import string "${target}" must be in format "<module>:<attribute>".\n→ Like: uvicorn main:app --reload`); continue; }
        [mod, varName] = target.split(":");
      }
      const file = here()[mod + ".py"];
      if (!file) { err(`ERROR:    Error loading ASGI app. Could not import module "${mod}".\n→ There’s no ${mod}.py in ${where(S.cwd)}. Here there is: ${listing(here())}`); continue; }
      const vars = (file && file.vars) || ["app"];
      if (!vars.includes(varName)) { err(`ERROR:    Error loading ASGI app. Attribute "${varName}" not found in module "${mod}".\n→ In ${mod}.py the FastAPI app is called: ${vars.join(", ")}`); continue; }
      if (!pk.has("fastapi")) { err(`ModuleNotFoundError: No module named 'fastapi'\n→ pip install fastapi${S.venv ? "" : "  (with the virtual environment turned on)"}`); continue; }
      const reload = fastapiCli ? args[0] === "dev" : args.includes("--reload");
      const port = (() => { const i = args.indexOf("--port"); return i > -1 ? args[i + 1] : "8000"; })();
      say(`INFO:     ${reload ? "Will watch for changes in these directories: [" + where(S.cwd) + "]\nINFO:     " : ""}Uvicorn running on http://127.0.0.1:${port} (Press CTRL+C to quit)\nINFO:     Application startup complete.`);
      startServer("uvicorn", { module: mod, app: varName, reload, port });
      continue;
    }
    if (c === "python" || c === "python3" || c === "py") {
      const f = args[0];
      if (!f) { say("(Python’s interactive prompt opens. Type exit() to leave.)", "info"); continue; }
      if (!here()[f]) { err(`python: can't open file '${where([...S.cwd, f])}': [Errno 2] No such file or directory`); continue; }
      say(`(${f} ran and finished.)${/main\.py$/.test(f) ? "\n→ To start a FastAPI app, use: uvicorn main:app --reload" : ""}`, "info");
      log("python", { file: f });
      continue;
    }
    if (c === "git") { say("(git works here in real life, but this practice terminal doesn’t track it.)", "info"); continue; }
    err(`zsh: command not found: ${cmd}`);
  }

  const state = {
    cwd: S.cwd.join("/"), events: S.events, venv: S.venv, server: S.server, count: lines.length,
    exists: path => { const parts = split(path); let n = S.tree; for (const p of parts) { const k = findKey(n, p); if (!k) return false; n = n[k]; } return true; },
    did: (kind, test = () => true) => S.events.findIndex(e => e.kind === kind && test(e)),
    pkgs: where => (where === "global" ? S.global : S.venvPkgs[where] || new Set()),
  };
  return { out: S.out, state };
}

function termCheck(q, code) {
  const { state } = termRun(q.term, code);
  if (!state.count) return (q.checks || []).map(c => ({ name: c.name, pass: false, why: "Write your commands first, one per line." }));
  return (q.checks || []).map(c => {
    let pass = false;
    try { pass = !!c.ok(state); } catch {}
    const why = pass ? "" : typeof c.why === "function" ? c.why(state) : c.why || "Not yet.";
    return { name: c.name, pass, why };
  });
}

// ───── Python, in a background worker with Pyodide ─────
// The first Python question downloads Python (about 10 MB, cached afterwards).
// FastAPI, Pydantic and SQLAlchemy are small built-in stand-ins that behave like the real ones
// (PY_FILES is filled in by the build).
const PYODIDE_URL = "https://cdn.jsdelivr.net/npm/pyodide@314.0.7/";
const PY_TIMEOUT = 10000;
const PY_WORKER = `
let py = null, ready = null;
self.onmessage = async (e) => {
  const m = e.data;
  if (m.type === "init") {
    ready = (async () => {
      const { loadPyodide } = await import(m.base + "pyodide.mjs");
      py = await loadPyodide({ indexURL: m.base });
      for (const [path, src] of Object.entries(m.files)) {
        const full = "/practice/" + path;
        py.FS.mkdirTree(full.slice(0, full.lastIndexOf("/")));
        py.FS.writeFile(full, src);
      }
      py.runPython('import sys; sys.path[:0] = ["/practice/stubs", "/practice"]; import harness; harness._baseline()');
      if (m.limit) py.runPython("import harness; harness.set_limit(" + Number(m.limit) + ")");
    })();
    ready.then(() => self.postMessage({ type: "ready" }), err => self.postMessage({ type: "failed", error: String(err && err.message || err) }));
    return;
  }
  try {
    await ready;
    const h = py.pyimport("harness");
    const res = m.kind === "run" ? h.run_json(m.code, m.stdin || "", m.setup || "")
              : m.kind === "docs" ? h.docs_json(m.code, "", m.setup || "")
              : m.kind === "call" ? h.call_json(m.method, m.url, typeof m.body === "string" ? m.body : undefined)
              : h.check_json(m.code, m.stdin || "", m.setup || "", JSON.stringify(m.tests || []));
    self.postMessage({ id: m.id, ok: true, result: JSON.parse(res) });
  } catch (err) {
    self.postMessage({ id: m.id, ok: false, error: String(err && err.message || err) });
  }
};`;

let pyWorker = null, pyReady = null, pySeq = 0, pyOnPage = false;
const pyPending = new Map();

// Some places (like a sandboxed preview frame) don't allow this kind of worker. Then Python runs on the
// page itself: the same code, talking through a stand-in for the worker, with a time limit inside Python.
function pageWorker() {
  const inner = { onmessage: null, postMessage: m => setTimeout(() => outer.onmessage && outer.onmessage({ data: m })) };
  const outer = { onmessage: null, onerror: null, terminate() {}, postMessage: m => setTimeout(() => inner.onmessage && inner.onmessage({ data: m }), 30) };
  new Function("self", PY_WORKER)(inner);
  return outer;
}

function pyStart() {
  let worker = null;
  if (!pyOnPage) {
    try { worker = new Worker(URL.createObjectURL(new Blob([PY_WORKER], { type: "text/javascript" })), { type: "module" }); }
    catch { pyOnPage = true; }
  }
  if (pyOnPage) worker = pageWorker();
  pyWorker = worker;
  pyReady = new Promise((res, rej) => {
    worker.onmessage = e => {
      const m = e.data;
      if (m.type === "ready") return res();
      if (m.type === "failed") return rej(new Error("Python didn’t load. Check the internet connection and refresh. (" + m.error + ")"));
      const p = pyPending.get(m.id); if (!p) return;
      pyPending.delete(m.id); clearTimeout(p.timer);
      m.ok ? p.res(m.result) : p.rej(new Error(m.error));
    };
    worker.onerror = () => {
      // The worker couldn't start here: run Python on the page instead.
      if (pyOnPage) return rej(new Error("Python didn’t load. Check the internet connection and refresh."));
      try { worker.terminate(); } catch {}
      pyOnPage = true;
      pyStart();
      pyReady.then(res, rej);
    };
  });
  worker.postMessage({ type: "init", base: PYODIDE_URL, files: PY_FILES, limit: pyOnPage ? PY_TIMEOUT / 1000 : 0 });
}
const pyRestart = () => { if (pyOnPage) return; try { pyWorker.terminate(); } catch {} pyWorker = null; pyReady = null; };
function pyWarm() { if (!pyWorker) pyStart(); return pyReady; }

async function pyCall(msg, onLoading) {
  if (!pyWorker) pyStart();
  let loaded = false;
  pyReady.then(() => { loaded = true; }, () => {});
  await Promise.resolve();
  if (!loaded && onLoading) onLoading();
  await pyReady;
  const id = ++pySeq;
  return new Promise((res, rej) => {
    const timer = pyOnPage ? null : setTimeout(() => {
      pyPending.delete(id); pyRestart();
      rej(new Error(`Your program ran for more than ${PY_TIMEOUT / 1000} seconds, so it was stopped.\n→ Is there a loop that never ends, or an input() waiting for more input?`));
    }, PY_TIMEOUT);
    pyPending.set(id, { res, rej, timer });
    pyWorker.postMessage({ id, ...msg });
  });
}

async function runPython(q, code, { log, stdin, onLoading }) {
  try {
    const r = await pyCall({ kind: "run", code, stdin: stdin ?? q.stdin ?? "", setup: q.setup || "" }, onLoading);
    if (r.out) log("log", r.out.replace(/\n$/, ""));
    if (r.err) log("err", r.err);
    if (!r.out && !r.err) log("info", nothingPrinted(q, r));
  } catch (e) { log("err", e.message); }
}

// Run printed nothing: usually the code only defines functions (or endpoints) and nothing calls them.
function nothingPrinted(q, r) {
  const funcs = r.funcs || [];
  const calls = (q.tests || []).map(t => (t.expr || "").trim());
  if (r.app) {
    const ex = calls.find(c => /^TestClient\(app\)\.\w+\([^()]*\)(\.json\(\))?$/.test(c)) || 'TestClient(app).get("/")';
    const line = /\.json\(\)$|\.status_code$/.test(ex) ? ex : ex + ".json()";
    return `It ran without errors, but nothing was printed: an app only answers when something sends it a request.\n→ To try an endpoint here, add at the end:\n   from fastapi.testclient import TestClient\n   print(${line})\n→ Or press “Check my code” to run the tests.`;
  }
  if (funcs.length) {
    const names = funcs.map(f => f.split("(")[0]);
    const ex = calls.find(c => names.some(n => c.startsWith(n + "(")) && /^\w+\([^()]*\)$/.test(c));
    const example = ex || funcs[0].replace(/\(.*\)/, "(…)");
    return `It ran without errors, but nothing was printed: your code defines ${funcs.join(", ")}, and nothing calls ${funcs.length === 1 ? "it" : "them"}.\n→ To see what ${funcs.length === 1 ? "it gives" : "they give"} back, add a line at the end, like:  print(${example})\n→ Or press “Check my code” to run the tests.`;
  }
  return "(It ran, and nothing was printed.)";
}

async function checkPython(q, code, tests, onLoading) {
  try {
    const r = await pyCall({ kind: "check", code, stdin: q.stdin || "", setup: q.setup || "", tests }, onLoading);
    return r.results;
  } catch (e) {
    return tests.map(t => ({ name: t.name || t.expr, pass: false, why: e.message }));
  }
}

// ───── API docs: start the app once, then send it requests ─────
const apiDocs = (q, code, onLoading) => pyCall({ kind: "docs", code, setup: q.setup || "" }, onLoading);
const apiCall = (method, url, body) => pyCall({ kind: "call", method, url, body: body ?? null });

// ───── one door for every language ─────
async function runCode(q, code, { log, previewHost, stdin, onLoading } = {}) {
  if (q.lang === "terminal") {
    const { out, state } = termRun(q.term, code);
    if (!state.count) { log("info", "Write your commands first, one per line."); return; }
    for (const o of out) log(o.kind, o.text);
    return;
  }
  if (q.lang === "python") return runPython(q, code, { log, stdin, onLoading });
  return runJs(q, code, { log, previewHost });
}

async function checkCode(q, code, { onLoading } = {}) {
  if (q.lang === "terminal") return termCheck(q, code);
  if (q.lang === "python") return checkPython(q, code, q.tests || [], onLoading);
  return checkJs(q, code, q.tests || []);
}

const checkNames = q => (q.lang === "terminal" ? (q.checks || []).map(c => c.name) : (q.tests || []).map(t => t.name || t.expr));

// Each bank file adds its questions here. Question fields:
//   id, topic, type ("mcq" | "blank" | "write" | "debug"), title, q (Markdown), why (the explanation), hint
//   mcq:    code?, codeLang?, opts [...], a (index of the right option)
//   blank:  code with __1__, __2__ …, lang, acc [[accepted answers for blank 1], …], anyOrder?

//           tests [{ name, expr, op, expected, msg }] (js, react, python), setup?, preview?, stdin?
//           terminal: term { tree, start }, checks [{ name, ok: s => …, why }]
const BANK = [];
const NOTES = {};

NOTES.js = `## JavaScript: the essentials

### Variables
- \`const\` for values that never get a new value, \`let\` for values that change. Avoid \`var\`.
- \`const price = 50; price = 60;\` → **TypeError: Assignment to constant variable**.
- \`let\` and \`const\` only exist inside the \`{ }\` block where they were made.

### Types and operators
- Numbers \`42\`, text (strings) \`"Asha"\`, booleans \`true\`/\`false\`, \`null\`, \`undefined\`, arrays \`[1, 2]\`, objects \`{ name: "Asha" }\`.
- \`+\` with any text **joins**: \`"5" + 3\` is \`"53"\`. Other maths converts text to numbers: \`"10" - 4\` is \`6\`.
- Turn text into a number with \`Number("60")\` (or \`parseInt\`, \`parseFloat\`).
- Always compare with \`===\` (same value **and** type): \`5 === "5"\` is \`false\`.
- \`%\` is the remainder: \`7 % 2\` is \`1\`, so a number is even when \`n % 2 === 0\`.
- **Falsy** values act like false in an \`if\`: \`0\`, \`""\`, \`null\`, \`undefined\`, \`NaN\`, \`false\`. Everything else is truthy, even \`"0"\` and \`[]\`.
- \`a || b\` is "a or b": each side is a whole check. Write \`day === "Sat" || day === "Sun"\`, not \`day === "Sat" || "Sun"\`.

### Maths
| Operator | Meaning | Example |
|---|---|---|
| \`+ - * /\` | add, subtract, multiply, divide | \`7 / 2\` → \`3.5\` |
| \`%\` | remainder | \`17 % 5\` → \`2\`; even when \`n % 2 === 0\` |
| \`**\` | power | \`2 ** 3\` → \`8\` |
| \`+= -= *= /=\` | change a variable | \`total += price\` is \`total = total + price\` |
| \`++ --\` | add or take away 1 | \`count++\` |
- \`*\` and \`/\` happen before \`+\` and \`-\`: \`10 + 5 * 2\` is 20. Use brackets: \`(a + b) / 2\`.
- \`Math.round(2.5)\` → 3 (nearest), \`Math.floor(2.9)\` → 2 (down), \`Math.ceil(2.1)\` → 3 (up), \`Math.max(3, 9)\` → 9, \`Math.min\`, \`Math.abs(-4)\` → 4.
- Whole-number division: \`Math.floor(23 / 5)\` → 4; what's left: \`23 % 5\` → 3.
- \`price.toFixed(2)\` shows 2 decimals but gives back **text**: do the maths first, \`toFixed\` last.
- \`Number("abc")\` is **NaN** (not a number). Text compares like a dictionary: \`"10" < "9"\` is true, so turn form input into numbers first.
- When adding up start at \`0\`; when multiplying start at \`1\`.

### Conditions
\`\`\`js
if (marks >= 90) {
  grade = "A";
} else if (marks >= 75) {      // checked only if the first was false
  grade = "B";
} else {
  grade = "C";
}
const label = age >= 18 ? "Adult" : "Minor";   // condition ? if true : if false
\`\`\`
- Comparisons: \`=== !== > < >= <=\`. One \`=\` **sets** a value; it doesn't compare.
- Only the **first** true branch runs, so check the strictest condition first.
- \`&&\` both must be true · \`||\` at least one · \`!\` flips: \`x > 10 && x < 20\`.

### Loops
\`\`\`js
for (let i = 1; i <= 5; i++) { ... }    // 1, 2, 3, 4, 5  (i < 5 would stop at 4)
for (const mark of marks) { ... }       // each item of an array

let n = 3;
while (n > 0) {                         // repeats while the condition is true
  n--;                                  // something must change, or it never ends
}
\`\`\`
- \`break\` leaves the loop early; \`return\` leaves the whole function.

### Loop patterns
Most “write a function” questions are one of these. Start a variable **before** the loop, change it **inside**, give it back **after**.
\`\`\`js
let total = 0;                     // add up (start at 0)
for (const m of marks) total += m;

let product = 1;                   // multiply (start at 1)
for (let i = 1; i <= n; i++) product *= i;

let count = 0;                     // count the ones that pass
for (const m of marks) if (m >= 40) count++;

let max = marks[0];                // biggest so far
for (const m of marks) if (m > max) max = m;

const lines = [];                  // build a list
for (let i = 1; i <= 10; i++) lines.push(n + " x " + i + " = " + n * i);

let text = "";                     // build text backwards
for (let i = word.length - 1; i >= 0; i--) text += word[i];
\`\`\`
- Give back an object with two values: \`return { area, perimeter };\` (short for \`{ area: area, perimeter: perimeter }\`).
- \`return\` inside a loop stops the whole function at once, so only say “no” **after** the loop has checked everything.

### Text
- Template literals use **backticks** (the key under Esc). In "double quotes", \`\${name}\` is just text:
\`\`\`js
const msg = \`Hello, \${name}!\`;
\`\`\`
- \`.length\`, \`.toUpperCase()\`, \`.toLowerCase()\`, \`.includes("x")\`, \`.trim()\`, \`.split(",")\`, \`text[0]\` (first letter).

### Functions
\`\`\`js
function add(a, b) {
  return a + b;          // without return, the function gives back undefined
}
const square = (n) => n * n;               // arrow function: gives back n * n by itself
const double = (n) => { return n * 2; };   // with { } you must write return
\`\`\`

### Arrays
- Positions start at 0: the first is \`arr[0]\`, the last is \`arr[arr.length - 1]\`.
- \`push\` adds to the end, \`includes\` checks, \`indexOf\` finds a position.
- \`for (const item of arr)\` gives the **items**. \`for (const i in arr)\` gives the positions as text ("0", "1"): don't use it for arrays.
- \`for (let i = 0; i < arr.length; i++)\`: use \`<\`, not \`<=\`.
- \`map\` → a new array with every item changed. \`filter\` → a new array with the items that pass. \`find\` → the first item that passes (or \`undefined\`). \`reduce\` → one value, like a total.
\`\`\`js
const prices = items.map((item) => item.price);
const cheap = items.filter((item) => item.price < 50);
const tea = items.find((item) => item.name === "Tea");
const total = prices.reduce((sum, p) => sum + p, 0);
\`\`\`
- Spread copies items into a new array: \`[...fruits, "Mango"]\`.

### Objects
- Dot for a fixed name: \`user.name\`. Brackets when the name is in a variable: \`marks[subject]\`.
- Destructuring pulls properties out by name: \`const { name, email } = user;\`. A name that isn't in the object gives \`undefined\`.
- Nested: \`student.marks.physics\`, or \`const { physics } = student.marks;\`.
- Counting with an object: \`counts[vote] = (counts[vote] || 0) + 1;\`

### fetch, Promises, async/await
\`\`\`js
async function loadUsers() {
  const res = await fetch("https://dummyjson.com/users");   // wait for the reply
  const data = await res.json();                            // read it into an object
  return data.users;
}
// or: fetch(url).then((res) => res.json()).then((data) => console.log(data));
// a variable in the URL needs backticks: fetch(\`https://dummyjson.com/products/\${id}\`)
\`\`\`
- \`fetch\` gives back a **Promise** straight away; the data comes later.
- \`await\` only works inside an \`async\` function. Forgetting it gives a Promise instead of the value.
- In a \`.then\` chain, each step passes on what it **gives back**: \`.then((res) => res.json())\`, not \`.then((res) => { res.json(); })\`.
- \`fetch\` doesn’t fail on 404: check \`res.ok\` (true for 200–299) or \`res.status\` before using the data.
- \`\${id}\` only works inside **backticks** (a template literal), not "quotes": see the last line of the code above.
- Look at the reply first (\`console.log(data)\`): the list is often inside it, like \`data.users\` or \`data.products\`.
- \`JSON.stringify(obj)\` turns an object into text; \`JSON.parse(text)\` turns it back.

### Fetch, then give back what's asked for
\`\`\`js
async function productTitles() {
  const res = await fetch("https://dummyjson.com/products");
  const data = await res.json();                   // { products: [...], total: 194 }
  return data.products.map((p) => p.title);        // just one field of each
}
// one field of one object:   const user = await res.json(); return user.email;
// how many pass a test:      return data.todos.filter((t) => t.completed).length;
// the average:               total of the prices / data.products.length
// names of the matching ones: data.users.filter((u) => u.age > age).map((u) => u.firstName)
// an id in the URL:          fetch(\`https://dummyjson.com/users/\${id}\`)
\`\`\`
- An \`async\` function always gives back a **Promise**: use it with \`await\` (inside another async function) or \`.then((value) => …)\`.

### Calling your own FastAPI
Your API runs at **http://127.0.0.1:8000** (\`uvicorn main:app --reload\`); the React app at **http://localhost:5173** (\`npm run dev\`). Always fetch the API's full address, with \`http://\` and port 8000.
\`\`\`js
// GET: FastAPI sends exactly what the endpoint returns (often the list itself)
const res = await fetch("http://127.0.0.1:8000/menu");
const menu = await res.json();            // menu is the array: menu.map(...)

// path parameter /students/{student_id}  and  query parameter ?q=
await fetch(\`http://127.0.0.1:8000/students/\${id}\`);
await fetch(\`http://127.0.0.1:8000/search?q=\${word}\`);

// POST: method + Content-Type + body as text
await fetch("http://127.0.0.1:8000/orders", {
  method: "POST",
  headers: { "Content-Type": "application/json" },
  body: JSON.stringify({ item: "Vada", quantity: 3 }),
});

// DELETE
await fetch(\`http://127.0.0.1:8000/orders/\${id}\`, { method: "DELETE" });
\`\`\`
| What you see | Usually means |
|---|---|
| Unexpected token '<' … is not valid JSON | you fetched the React app (5173) or a wrong URL, and got HTML |
| 404 | wrong path, or \`?student_id=1\` instead of \`/students/1\` |
| 405 Method Not Allowed | right URL, wrong method (GET instead of POST/DELETE) |
| 422 | a name or type doesn't match: \`?query=\` vs \`q\`, no Content-Type, body not \`JSON.stringify\`-ed |
| Request with GET/HEAD method cannot have body | \`method: "POST"\` is missing |
- An error reply still has a body: FastAPI puts the message in \`detail\`. Check \`res.ok\` before using the data.

### Reading errors
- **ReferenceError: x is not defined** → spelling, capitals, or used outside its block.
- **TypeError: … is not a function** / **Cannot read properties of undefined** → the value isn’t what you think: \`console.log\` it.
- **SyntaxError** → a bracket, quote or brace is missing.

      { name: "All negative: [-5, -2, -9] → -2", expr: "highest([-5, -2, -9])", op: "equals", expected: "-2", msg: "highest([-5, -2, -9]) gave {got}. Start from the first mark, not from 0." },
    ],
    hint: "Start with the first mark, `marks[0]`, not 0 — otherwise all-negative marks go wrong.",
    why: "Keep the best so far, starting from the **first** item. Starting at 0 would wrongly give 0 when every mark is negative. (`Math.max(...marks)` also works.)" },
  { id: "js-w9", type: "write", lang: "js", title: "Load the first names",

    starter: "async function loadFirstNames() {\n  // fetch, read the JSON, then give back the first names\n}\n\nloadFirstNames().then((names) => console.log(names));\n",
    solution: 'async function loadFirstNames() {\n  const res = await fetch("https://dummyjson.com/users");\n  const data = await res.json();\n  return data.users.map((u) => u.firstName);\n}\n\nloadFirstNames().then((names) => console.log(names));\n',

    ],

    solution: 'async function firstUser() {\n  const res = await fetch("https://dummyjson.com/users");\n  const data = await res.json();\n  return data.users[0].firstName;\n}\n\nfirstUser().then((name) => console.log(name));\n',

// In the checks, fetch is replaced by a fake that answers with setReply(...). CALLS lists the URLs fetched;
// REQUESTS lists { url, method, headers, body } for each request.
const JF_PRODUCTS = '{ products: [{ id: 1, title: "Essence Mascara Lash Princess", price: 9.99 }, { id: 2, title: "Eyeshadow Palette with Mirror", price: 19.99 }, { id: 3, title: "Powder Canister", price: 14.99 }], total: 3 }';
const JF_USERS = '{ users: [{ id: 1, firstName: "Emily", age: 28 }, { id: 2, firstName: "Michael", age: 35 }, { id: 3, firstName: "Sophia", age: 42 }], total: 3 }';
const JF_TODOS = '{ todos: [{ id: 1, todo: "Buy milk", completed: true }, { id: 2, todo: "Study React", completed: false }, { id: 3, todo: "Call Asha", completed: true }], total: 3 }';
const JF_MENU = '[{ id: 1, name: "Masala dosa", price: 60 }, { id: 2, name: "Idli", price: 40 }, { id: 3, name: "Filter coffee", price: 20 }]';
const JF_LOCAL = "The API is **your own FastAPI app**, started with `uvicorn main:app --reload`, so it runs at `http://127.0.0.1:8000`.";
const jfTest = (name, reply, call, expected, msg) => ({ name, expr: `(setReply(${reply}), await ${call})`, op: "equals", expected, msg: msg || "It gave {got}" });
const jfUrl = (reply, call, url) => ({ name: "Fetches " + url, expr: `(setReply(${reply}), await ${call}, CALLS[0])`, op: "equals", expected: JSON.stringify(url), msg: "It fetched {got}" });
const jfAsync = (head, body, call) => `async function ${head} {\n${body}\n}\n\n${call}.then((result) => console.log(result));\n`;

// ═════════ React basics ═════════
NOTES.react = `## React basics: components, props, state

### Components
- A component is a **function that returns JSX**. Its name must start with a **capital letter**: \`<menuCard />\` is treated as an unknown HTML tag and shows nothing.
\`\`\`jsx
function Welcome() {
  return <h1>Welcome!</h1>;
}

function App() {
  return (
    <div>
      <Welcome />
      <Welcome />
    </div>
  );
}
\`\`\`
- Return **one** parent element. To return two side by side, wrap them in \`<div>…</div>\` or a fragment \`<>…</>\`.

### JSX rules
- \`{ }\` puts JavaScript in: \`<p>Hello, {name}!</p>\`. Without braces, \`name\` is just the word "name".
- \`className\` instead of \`class\`. Tags without children close themselves: \`<img src={photo} />\`, \`<input />\`.
- You can show text and numbers, not whole objects: \`{user.name}\`, not \`{user}\` (**Objects are not valid as a React child**).
- Attributes: fixed text in quotes, JavaScript values in braces with **no** quotes: \`<img src={product.thumbnail} alt={product.title} />\`.
- Events are camelCase: \`onClick\`, \`onChange\`, \`onSubmit\` (lowercase \`onclick\` is ignored).
- Styles take an object: \`style={{ color: "red", fontSize: 20 }}\`.
- Keep \`return (\` on the same line: a line break straight after \`return\` gives back nothing.
- \`{items.length && <p>…</p>}\` shows **0** when the list is empty; write \`{items.length > 0 && <p>…</p>}\`.

### Props
- Props are how a **parent passes data to a child**, written like HTML attributes:
\`\`\`jsx
<ProductCard title="Pen" price={20} />      // text in "quotes", anything else in { }

function ProductCard({ title, price }) {      // props arrive as ONE object: unpack it
  return <p>{title}: ₹{price}</p>;
}
// same as: function ProductCard(props) { return <p>{props.title}: ₹{props.price}</p>; }
\`\`\`
- \`price="20"\` passes the text "20"; \`price={20}\` passes the number 20.
- The names must match exactly: \`<Card title="…" />\` → \`{ title }\`.
- To tell the **parent** something, pass a function down: \`<Child onAdd={addItem} />\`, and the child calls \`onAdd()\`.
- Props are **read-only**. A child never changes its props.

### State with useState
\`\`\`jsx
import { useState } from "react";

function Counter() {
  const [count, setCount] = useState(0);          // value, setter = useState(starting value)
  return <button onClick={() => setCount(count + 1)}>Clicked {count} times</button>;
}
\`\`\`
- Calling the **setter** changes the value **and draws the component again**. Changing a normal variable (\`let count\`) changes nothing on screen.
- Never change state directly. For arrays and objects, make a new one:
  \`setItems([...items, "Pen"])\`, \`setItems(items.filter((x) => x !== "Pen"))\`.
- Toggle a true/false: \`setOpen(!open)\`.
- Each copy of a component has its own state.

### Events
- \`onClick={handleClick}\` or \`onClick={() => setCount(count + 1)}\`: give React a function to call **later**.
- \`onClick={setCount(count + 1)}\` calls it **while drawing** → **Too many re-renders**.

### Lists and conditions
\`\`\`jsx
<ul>
  {books.map((book) => (
    <li key={book.id}>{book.title}</li>      // ( ) gives the <li> back; { } would need return
  ))}
</ul>
\`\`\`
- Every list item needs a unique \`key\` so React can tell items apart.
- \`{isOpen && <p>Open now</p>}\` shows the \`<p>\` only when \`isOpen\` is true.
- \`{stock > 0 ? <p>In stock</p> : <p>Sold out</p>}\` picks one of two.

### Loading data once: useEffect
\`\`\`jsx
useEffect(() => {
  fetch("https://dummyjson.com/users")
    .then((res) => res.json())
    .then((data) => setUsers(data.users));   // put the data into state
}, []);                                       // [] = run once, after the first draw
\`\`\`
| Second argument | Runs |
|---|---|
| \`[]\` | once, after the first draw (load data here) |
| \`[userId]\` | after the first draw, and again when \`userId\` changes |
| nothing | after **every** draw (with a fetch inside: an endless loop) |
- The first draw happens **before** the data arrives: start lists with \`useState([])\`, single objects with \`useState(null)\` plus a Loading… check.
- To fetch on a **click** instead, put the fetch in the click handler, not in \`useEffect\`.

### Fetching and showing data: the full pattern
\`\`\`jsx
function UserProfile() {
  const [user, setUser] = useState(null);            // nothing yet
  useEffect(() => {
    fetch("https://dummyjson.com/users/1")
      .then((res) => res.json())
      .then((data) => setUser(data));
  }, []);
  if (!user) return <p>Loading…</p>;                  // the first draw happens before the data arrives
  return <h2>{user.firstName} {user.lastName}</h2>;
}
\`\`\`
| Bug | Fix |
|---|---|
| Fetches again and again | \`useEffect(() => { … }, [])\`: add the \`[]\`, and keep fetch inside the effect (not in the component body) |
| Cannot read properties of undefined (reading 'map') | start a list with \`useState([])\`, not \`useState()\` |
| users.map is not a function | put the array in state: \`setUsers(data.users)\`, not \`setUsers(data)\` |
| Cannot read properties of null | \`if (!user) return <p>Loading…</p>;\` before using \`user.something\` |
| Empty items, no error | use the API’s real field names (\`console.log(data)\` to see them) |
| Loading… forever | call \`setLoading(false)\` when the data arrives |
| Fetches without a click | \`onClick={load}\`, not \`onClick={load()}\` |
| A child shows nothing | unpack props: \`function Card({ product })\` |

### Calling your own API from React
Your API: **http://127.0.0.1:8000** (\`uvicorn main:app --reload\`). The React app: **http://localhost:5173** (\`npm run dev\`). The API must allow the app with CORS (see the FastAPI notes).
\`\`\`jsx
// load: FastAPI sends what the endpoint returns, often the list itself
useEffect(() => {
  fetch("http://127.0.0.1:8000/menu")
    .then((res) => res.json())
    .then((data) => setMenu(data));              // not data.menu
}, []);

// send: a button that creates something
const order = async () => {
  const res = await fetch("http://127.0.0.1:8000/orders", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ item: "Vada", quantity: 3 }),
  });
  const data = await res.json();
  setMessage(\`Order \${data.id} placed\`);
};

// delete, then update the list on screen
const cancel = async (id) => {
  await fetch(\`http://127.0.0.1:8000/orders/\${id}\`, { method: "DELETE" });
  setOrders(orders.filter((o) => o.id !== id));
};

// a 404 still has a body: check res.ok and remember it in state
async function load() {
  const res = await fetch(\`http://127.0.0.1:8000/students/\${id}\`);
  if (!res.ok) { setNotFound(true); return; }
  setStudent(await res.json());
}
\`\`\`
- Use the field names your API sends (\`student.name\`), the query names it reads (\`?q=\` for \`def search(q: str)\`), and its port (8000, not 5173).
`;
