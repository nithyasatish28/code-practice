  `import { useState, useEffect } from "react";\n\nfunction UserList() {\n  const [users, setUsers] = ${start};\n\n  useEffect(() => {\n    fetch("https://dummyjson.com/users")\n      .then((res) => res.json())\n      .then((data) => ${setter});\n  }${effectEnd});\n\n  return (\n    <ul>\n      {users.map((u) => (\n        <li key={u.id}>${item}</li>\n      ))}\n    </ul>\n  );\n}\n`;

  { id: "react-w8", type: "write", lang: "react", preview: "UserList", title: "Load and list users",

  { id: "react-w9", type: "write", lang: "react", preview: "ProductList", title: "Product cards from an API",

  { id: "react-w11", type: "write", lang: "react", preview: "App", title: "A product by id (and 404)",
    q: "Write `ProductDetail`: it gets an `id` prop and fetches `https://dummyjson.com/products/ID`. Show `<h2>` title and `<p>` price like `$19.99`. If `res.ok` is false (the API answers 404 for a product that doesn’t exist), show `<p>Product not found</p>` instead. `App` is done.",
    starter: HOOKS + "function ProductDetail({ id }) {\n  // your code\n}\n\nfunction App() {\n  return <ProductDetail id={2} />;\n}\n",
    solution: HOOKS + 'function ProductDetail({ id }) {\n  const [product, setProduct] = useState(null);\n  const [notFound, setNotFound] = useState(false);\n\n  useEffect(() => {\n    async function load() {\n      const res = await fetch(`https://dummyjson.com/products/${id}`);\n      if (!res.ok) {\n        setNotFound(true);\n        return;\n      }\n      const data = await res.json();\n      setProduct(data);\n    }\n    load();\n  }, [id]);\n\n  if (notFound) return <p>Product not found</p>;\n  if (!product) return <p>Loading…</p>;\n\n  return (\n    <div>\n      <h2>{product.title}</h2>\n      <p>${product.price}</p>\n    </div>\n  );\n}\n\nfunction App() {\n  return <ProductDetail id={2} />;\n}\n',
    tests: [
      { name: "Fetches the right product", expr: `(await render(ProductDetail, { id: 2 }, { reply: ${R_PRODUCT2} })).fetchCalls`, op: "equals", expected: '["https://dummyjson.com/products/2"]', msg: "It fetched {got}" },
      { name: "Shows title and price", expr: `(await render(ProductDetail, { id: 2 }, { reply: ${R_PRODUCT2} })).texts("h2, p")`, op: "equals", expected: '["Eyeshadow Palette with Mirror", "$19.99"]', msg: "It shows {got}" },
      { name: "404 → Product not found", expr: `(await render(ProductDetail, { id: 999 }, { reply: { message: "Product with id '999' not found" }, status: 404 })).text`, op: "equals", expected: '"Product not found"', msg: "For a 404 it shows {got}" },
    ],
    hint: "Check `res.ok` before reading the JSON, and keep a second piece of state such as `notFound`.",
    why: "Build the URL with backticks and `${id}`, and list `id` in the effect’s array. `fetch` doesn’t fail on 404, so check `res.ok`: if it’s false, set `notFound` to true and stop (`return`); otherwise read the JSON and keep the product." },
  { id: "react-w12", type: "write", lang: "react", preview: "QuoteButton", title: "A quote on click",

  { id: "react-w14", type: "write", lang: "react", preview: "Cart", title: "A cart with a total",

  { id: "react-w16", type: "write", lang: "react", preview: "App", title: "A counter with props",

NOTES.terminal = `## Terminal commands

### Moving around
| Command | What it does |
|---|---|
| \`pwd\` | shows the folder you’re in |
| \`ls\` | lists what’s in this folder (\`dir\` on Windows Command Prompt) |
| \`cd projects\` | goes into the folder \`projects\` |
| \`cd projects/canteen\` | goes two folders down in one step |
| \`cd ..\` | goes up one folder |
| \`cd\` or \`cd ~\` | goes back to your home folder |
| \`mkdir backend\` | makes a new folder (\`mkdir -p a/b\` makes both at once) |
| \`code .\` | opens this folder in VS Code |
| \`clear\` | clears the screen |

- Paths are written **from where you are**. If \`cd canteen\` says *no such file or directory*, run \`ls\`: the folder isn’t here (maybe it’s inside another folder).
- Press **Tab** to finish a folder name for you.

### A React app with Vite (Node.js and npm)
\`\`\`bash
npm create vite@latest canteen -- --template react   # make a new project
cd canteen                                          # go into it
npm install                                         # download its packages into node_modules
npm run dev                                         # start it: http://localhost:5173
\`\`\`
- \`npm install\` reads **package.json** in the current folder. *Could not read package.json* → you’re in the wrong folder.
- *vite: command not found* → the packages aren’t installed yet: run \`npm install\`.
- Vite apps start with \`npm run dev\`. (\`npm start\` is for older Create React App projects.)
- Stop a running server with **Ctrl + C**. You need \`npm install\` once per project (and again when someone adds a package), not every day.

### A FastAPI app (Python)
\`\`\`bash
cd library-api
python -m venv venv                 # make a virtual environment called venv (python3 on Mac/Linux)
source venv/bin/activate            # turn it on (Mac/Linux)
venv\\Scripts\\activate               # turn it on (Windows)
pip install fastapi uvicorn sqlalchemy
uvicorn main:app --reload           # start the server: http://127.0.0.1:8000
\`\`\`
- A **virtual environment** keeps each project’s packages separate. When it’s on, the prompt starts with \`(venv)\`.
- Make it and turn it on **before** \`pip install\`, so the packages go into it.
- \`uvicorn main:app\` means: the file **main**.py, the variable **app** inside it (\`app = FastAPI()\`).
- \`--reload\` restarts the server every time you save a file.
- Open **http://127.0.0.1:8000/docs** to try every endpoint in the browser.
- Next day: \`cd\` into the project, turn the venv on again, then \`uvicorn main:app --reload\`. No need to reinstall.
- \`pip install -r requirements.txt\` installs every package listed in that file.
`;

const VITE_APP = () => ({ "package.json": { $file: true, scripts: ["dev", "build", "lint", "preview"] }, "index.html": 1, "vite.config.js": 1, src: { "App.jsx": 1, "main.jsx": 1 }, public: {} });
const API_APP = () => ({ "main.py": { $file: true, vars: ["app"] }, "functions.py": 1, "requirements.txt": { $file: true, packages: ["fastapi", "uvicorn", "sqlalchemy"] } });
const ran = (s, kind, test) => s.did(kind, test) > -1;
const before = (s, a, b) => { const i = s.did(...a), j = s.did(...b); return i > -1 && j > -1 && i < j; };

NOTES.fastapi = `## FastAPI: building an API

### The smallest app
\`\`\`python
from fastapi import FastAPI

app = FastAPI()

@app.get("/")
def home():
    return {"message": "Hello"}      # a dict or list is sent back as JSON
\`\`\`
Run it with \`uvicorn main:app --reload\` and open http://127.0.0.1:8000/docs to try it.

### HTTP methods
| Method | Used to | Decorator |
|---|---|---|
| GET | read data | \`@app.get("/books")\` |
| POST | create something new | \`@app.post("/books")\` |
| PUT / PATCH | change something (PUT: replace it, PATCH: change part of it) | \`@app.put("/books/{book_id}")\` |
| DELETE | delete something | \`@app.delete("/books/{book_id}")\` |

### Status codes
| Code | Means |
|---|---|
| 200 OK | it worked (the default) |
| 201 Created | something new was made: \`@app.post("/orders", status_code=201)\` |
| 404 Not Found | that thing (or that URL) doesn’t exist |
| 405 Method Not Allowed | the URL exists, but not for this method (e.g. POST to a GET-only route) |
| 422 Unprocessable Content | the data sent is wrong: \`/books/abc\` when an int is needed, or a missing field |
| 500 Internal Server Error | your code crashed |

### Path parameters: part of the URL
\`\`\`python
@app.get("/books/{book_id}")
def get_book(book_id: int):           # same name as in {…}; ": int" turns "7" into 7 (or gives 422)
    return functions.get_book(book_id)
\`\`\`
- The names must match: \`{book_id}\` ↔ \`book_id\`. Otherwise FastAPI treats it as a missing query parameter → 422.
- Without \`: int\` the value is the **text** "7", which won’t match number ids.

### Query parameters: after the ?
\`\`\`python
@app.get("/books")
def list_books(author: str | None = None, limit: int = 10):   # /books?author=Narayan&limit=5
    ...
\`\`\`
- Any function parameter that isn’t in the path is a query parameter.
- **With a default** it’s optional (\`= None\`, \`= 10\`); **without** one it’s required → 422 if missing.
- \`Optional[str] = None\` (from typing) means the same as \`str | None = None\`.

### Request bodies with Pydantic
\`\`\`python
from pydantic import BaseModel

class Order(BaseModel):
    item: str
    quantity: int

@app.post("/orders", status_code=201)
def create_order(order: Order):                 # FastAPI reads the JSON body into an Order
    return functions.add_order(order.item, order.quantity)
\`\`\`
- Missing fields or wrong types → **422** automatically. \`"2"\` is accepted for an int; \`5\` is not accepted for a str.
- \`order.model_dump()\` gives a dict.

### Errors
\`\`\`python
from fastapi import HTTPException

book = functions.get_book(book_id)
if book is None:
    raise HTTPException(status_code=404, detail="Book not found")
return book
\`\`\`
- **raise**, don’t return, the exception. Returning it sends a 200 with odd JSON.

### Route order
Routes are checked top to bottom. Put fixed paths like \`/books/available\` **above** \`/books/{book_id}\`, or "available" is taken as a book_id (→ 422).

### main.py and functions.py
Keep the endpoints in **main.py** and the database work in **functions.py**; endpoints call \`functions.get_book(book_id)\` and only deal with HTTP (paths, status codes, errors).

### Calling the API from React: CORS
The React app (\`npm run dev\`, **http://localhost:5173**) and the API (**http://127.0.0.1:8000**) are different *origins*, so the browser blocks the reply unless the API allows the app:
\`\`\`python
from fastapi.middleware.cors import CORSMiddleware

app.add_middleware(
    CORSMiddleware,
    allow_origins=["http://localhost:5173"],   # the React app's address, port included (or ["*"])
    allow_methods=["*"],
    allow_headers=["*"],
)
\`\`\`
- The error appears in the **browser console** (*blocked by CORS policy*), while \`/docs\` works fine.
- React sends a POST body with \`fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(order) })\`. The endpoint reads it with a model parameter (\`order: Order\`); plain \`str\`/\`int\` parameters are read from the query instead.
- The names must match exactly: \`?q=\` needs a parameter called \`q\`; JSON fields need model fields with the same names and types. Fields the app may leave out need a default.
`;

    opts: ["The text `{'ok': True}`", "JSON: `{\"ok\": true}`", "An HTML page", "Nothing: you must call json.dumps"], a: 1,
    why: "FastAPI turns dicts, lists, numbers and strings into JSON for you (Python’s True becomes JSON’s true)." },
  { id: "api-m11", type: "mcq", title: "raise or return?",
    q: "Which line correctly sends a 404?",
    opts: ["`return HTTPException(status_code=404)`", "`raise HTTPException(status_code=404, detail=\"Book not found\")`", "`return 404`", "`print(\"404\")`"], a: 1,
    why: "An HTTPException must be **raised**. Returning it sends status 200 with the exception’s fields as JSON." },
  { id: "api-m12", type: "mcq", title: "Why a BaseModel?",
    q: "Why write `class Order(BaseModel): item: str; quantity: int` for a POST endpoint?",
    opts: ["To make a database table", "To describe the JSON body, so FastAPI reads and checks it (422 if it’s wrong)", "To make the endpoint faster", "So the endpoint becomes GET"], a: 1,
    why: "Pydantic models describe the request body. FastAPI turns the JSON into an `Order`, with types checked." },
  { id: "api-m13", type: "mcq", title: "Names that don’t match",
    q: "What happens at `/books/3`?", code: '@app.get("/books/{book_id}")\ndef get_book(id: int):\n    return functions.get_book(id)', codeLang: "python",
    opts: ["It returns book 3", "404", "422: `id` is treated as a missing query parameter", "500"], a: 2,
    why: "The `{book_id}` in the path doesn’t match any parameter, and `id` isn’t in the path, so FastAPI expects `?id=` → 422. Use the same name in both places." },
  { id: "api-m14", type: "mcq", title: "Route order",
    q: "`@app.get(\"/books/{book_id}\")` (with `book_id: int`) is written **above** `@app.get(\"/books/available\")`. What does `/books/available` give?",
    opts: ["The available books", "422, because \"available\" is matched as a book_id first", "404", "Both lists"], a: 1,
    why: "FastAPI tries routes from top to bottom. Put the fixed path `/books/available` above `/books/{book_id}`." },
  { id: "api-m15", type: "mcq", title: "Why type hints?",
    q: "The endpoint is `def menu(veg=False)` (no type hint). What is `veg` at `/menu?veg=false`?",
    opts: ["`False`", "`True`", "The text `\"false\"` (which is truthy!)", "422"], a: 2,
    why: "Without a type hint the value stays text. `veg: bool = False` makes FastAPI turn \"false\" into `False`." },

  { id: "api-w1", type: "write", lang: "python", title: "The menu endpoint",
    q: "`functions.get_menu()` gives back a list of dishes. Write a **GET** endpoint at `/menu` that sends that list back.",
    setup: FN_MENU, starter: API_HEAD + "\n# Your endpoint here\n",
    solution: API_HEAD + '\n@app.get("/menu")\ndef menu():\n    return functions.get_menu()\n',
    tests: [
      { name: "GET /menu → 200", expr: get("/menu", ".status_code"), op: "equals", expected: "200", msg: "GET /menu gave status {got}" },
      { name: "GET /menu → the dishes", expr: get("/menu", ".json()"), op: "equals", expected: "MENU" },
    ],
    why: "A decorator with the method and path, and a function that returns the data. FastAPI turns the list into JSON." },
  { id: "api-w2", type: "write", lang: "python", title: "One student, or 404",
    q: "`functions.get_student(student_id)` gives back a student dict, or `None`. Write **GET** `/students/{student_id}`: send the student, or a **404** with detail `\"Student not found\"`.",
    setup: FN_STUDENTS, starter: API_HEAD + "\n# Your endpoint here\n",
    solution: API_HEAD + '\n@app.get("/students/{student_id}")\ndef get_student(student_id: int):\n    student = functions.get_student(student_id)\n    if student is None:\n        raise HTTPException(status_code=404, detail="Student not found")\n    return student\n',
    tests: [
      { name: "GET /students/1 → Asha", expr: get("/students/1", ".json()"), op: "equals", expected: '{"id": 1, "name": "Asha", "block": "A"}', msg: "It gave {got}" },
      { name: "GET /students/2 → Ravi", expr: get("/students/2", ".json()['name']"), op: "equals", expected: '"Ravi"' },
      { name: "GET /students/9 → 404 Student not found", expr: `(lambda r: (r.status_code, r.json()))(${get("/students/9")})`, op: "equals", expected: '(404, {"detail": "Student not found"})', msg: "It gave {got}" },
      { name: "GET /students/abc → 422", expr: get("/students/abc", ".status_code"), op: "equals", expected: "422", msg: "It gave {got}. Add the type hint: student_id: int" },
    ],
    why: "Path parameter with `: int` (the ids are numbers), then `raise HTTPException(status_code=404, …)` when the lookup finds nothing." },
  { id: "api-w3", type: "write", lang: "python", title: "Filter by author (optional)",
    q: "`functions.get_books(author)` gives back all books when `author` is `None`, or only that author’s books. Write **GET** `/books` with an **optional** query parameter `author`.",
    setup: FN_BOOKS, starter: API_HEAD + "\n# Your endpoint here\n",
    solution: API_HEAD + '\n@app.get("/books")\ndef list_books(author: str | None = None):\n    return functions.get_books(author)\n',
    tests: [
      { name: "GET /books → all 3", expr: get("/books", ".json()"), op: "equals", expected: "BOOKS", msg: "It gave {got}" },
      { name: "GET /books?author=R. K. Narayan → 2 books", expr: 'len(TestClient(app).get("/books", params={"author": "R. K. Narayan"}).json())', op: "equals", expected: "2", msg: "It gave {got} books" },
      { name: "An unknown author → []", expr: 'TestClient(app).get("/books", params={"author": "Nobody"}).json()', op: "equals", expected: "[]" },
    ],
    why: "A parameter that isn’t in the path is a query parameter; `= None` makes it optional." },
  { id: "api-w4", type: "write", lang: "python", title: "Place an order (POST)",
    q: "Write **POST** `/orders`. The JSON body has `item` (text) and `quantity` (a whole number). Save it with `functions.add_order(item, quantity)`, send back what that returns, and answer **201**.",
    setup: FN_ORDERS, starter: API_HEAD.replace("import functions", "from pydantic import BaseModel\nimport functions") + "\n# Your model and endpoint here\n",
    solution: API_HEAD.replace("import functions", "from pydantic import BaseModel\nimport functions") + '\n\nclass Order(BaseModel):\n    item: str\n    quantity: int\n\n\n@app.post("/orders", status_code=201)\ndef create_order(order: Order):\n    return functions.add_order(order.item, order.quantity)\n',
    tests: [
      { name: "A good order → 201", expr: 'TestClient(app).post("/orders", json={"item": "Dosa", "quantity": 2}).status_code', op: "equals", expected: "201", msg: "It gave status {got}" },
      { name: "It sends back the saved order", expr: 'TestClient(app).post("/orders", json={"item": "Dosa", "quantity": 2}).json()', op: "equals", expected: '{"id": 2, "item": "Dosa", "quantity": 2}', msg: "It sent back {got}" },
      { name: "quantity \"two\" → 422", expr: 'TestClient(app).post("/orders", json={"item": "Dosa", "quantity": "two"}).status_code', op: "equals", expected: "422", msg: "It gave {got}. Describe the body with a BaseModel so FastAPI checks it." },
      { name: "No item → 422", expr: 'TestClient(app).post("/orders", json={"quantity": 1}).status_code', op: "equals", expected: "422" },
    ],
    why: "A `BaseModel` describes the body, so FastAPI checks it and gives 422 for bad data. `status_code=201` goes in the decorator." },
  { id: "api-w5", type: "write", lang: "python", title: "Cancel an order (DELETE)",
    q: "Write **DELETE** `/orders/{order_id}`. `functions.delete_order(order_id)` gives back `True` if it deleted it or `False` if there was no such order. Send `{\"deleted\": ORDER_ID}`, or **404** with detail `\"Order not found\"`.",
    setup: FN_ORDERS, starter: API_HEAD + "\n# Your endpoint here\n",
    solution: API_HEAD + '\n@app.delete("/orders/{order_id}")\ndef cancel_order(order_id: int):\n    if not functions.delete_order(order_id):\n        raise HTTPException(status_code=404, detail="Order not found")\n    return {"deleted": order_id}\n',
    tests: [
      { name: "DELETE /orders/1 → {\"deleted\": 1}", expr: 'TestClient(app).delete("/orders/1").json()', op: "equals", expected: '{"deleted": 1}', msg: "It gave {got}" },
      { name: "It really is gone afterwards", expr: '(TestClient(app).delete("/orders/1"), functions.get_orders())[1]', op: "equals", expected: "[]" },
      { name: "DELETE /orders/5 → 404 Order not found", expr: '(lambda r: (r.status_code, r.json()))(TestClient(app).delete("/orders/5"))', op: "equals", expected: '(404, {"detail": "Order not found"})', msg: "It gave {got}" },
      { name: "GET /orders/1 isn’t allowed → 405", expr: get("/orders/1", ".status_code"), op: "equals", expected: "405", msg: "It gave {got}. Use @app.delete, not @app.get." },
    ],
    why: "`@app.delete`, the id as an `int` path parameter, and a 404 when nothing was deleted." },
  { id: "api-w6", type: "write", lang: "python", title: "Change a book’s status (PUT)",
    q: "Write **PUT** `/books/{book_id}`. The JSON body is `{\"status\": \"borrowed\"}` (any text). Call `functions.update_status(book_id, status)`: it gives back the updated book, or `None` if there’s no such book (then send **404** `\"Book not found\"`).",
    setup: FN_BOOKS, starter: API_HEAD.replace("import functions", "from pydantic import BaseModel\nimport functions") + "\n# Your model and endpoint here\n",
    solution: API_HEAD.replace("import functions", "from pydantic import BaseModel\nimport functions") + '\n\nclass StatusUpdate(BaseModel):\n    status: str\n\n\n@app.put("/books/{book_id}")\ndef update_book(book_id: int, update: StatusUpdate):\n    book = functions.update_status(book_id, update.status)\n    if book is None:\n        raise HTTPException(status_code=404, detail="Book not found")\n    return book\n',
    tests: [
      { name: "PUT /books/1 → status changes", expr: 'TestClient(app).put("/books/1", json={"status": "borrowed"}).json()["status"]', op: "equals", expected: '"borrowed"', msg: "It gave {got}" },
      { name: "It’s really saved", expr: '(TestClient(app).put("/books/3", json={"status": "lost"}), functions.get_book(3)["status"])[1]', op: "equals", expected: '"lost"' },
      { name: "PUT /books/9 → 404 Book not found", expr: '(lambda r: (r.status_code, r.json()))(TestClient(app).put("/books/9", json={"status": "x"}))', op: "equals", expected: '(404, {"detail": "Book not found"})', msg: "It gave {got}" },
      { name: "No body → 422", expr: 'TestClient(app).put("/books/1").status_code', op: "equals", expected: "422" },
    ],
    why: "Path parameter for which book, a BaseModel for the body, and the usual 404 check. The function takes both: `def update_book(book_id: int, update: StatusUpdate)`." },
  { id: "api-w7", type: "write", lang: "python", title: "Search with a limit",
    q: "Write **GET** `/search`. It needs a **required** query parameter `q` and an optional `limit` (default 5). Send back the first `limit` results of `functions.search(q)`.",
    setup: FN_SEARCH, starter: API_HEAD + "\n# Your endpoint here\n",
    solution: API_HEAD + '\n@app.get("/search")\ndef search(q: str, limit: int = 5):\n    return functions.search(q)[:limit]\n',
    tests: [
      { name: "/search?q=dosa → 5 results", expr: 'len(TestClient(app).get("/search?q=dosa").json())', op: "equals", expected: "5", msg: "It gave {got} results" },
      { name: "/search?q=dosa&limit=2 → 2 results", expr: 'TestClient(app).get("/search?q=dosa&limit=2").json()', op: "equals", expected: '["Masala dosa", "Plain dosa"]', msg: "It gave {got}" },
      { name: "/search with no q → 422", expr: get("/search", ".status_code"), op: "equals", expected: "422", msg: "It gave {got}. q should have no default, so it’s required." },
      { name: "limit=abc → 422", expr: get("/search?q=dosa&limit=abc", ".status_code"), op: "equals", expected: "422", msg: "It gave {got}. Add the type hint: limit: int = 5" },
    ],
    why: "No default = required (`q: str`); a default = optional (`limit: int = 5`). Slicing `[:limit]` keeps the first few." },
  { id: "api-w8", type: "write", lang: "python", title: "A book from the database",
    q: "Put it all together: write **GET** `/books/{book_id}` that reads the book from the database with a `Session`, and sends `{\"id\": …, \"title\": …, \"author\": …}`, or **404** `\"Book not found\"`.",
    starter: 'from fastapi import FastAPI, HTTPException\nfrom sqlalchemy import create_engine\nfrom sqlalchemy.orm import DeclarativeBase, Mapped, mapped_column, Session\n\nengine = create_engine("sqlite:///library.db")\n\n\nclass Base(DeclarativeBase):\n    pass\n\n\nclass Book(Base):\n    __tablename__ = "books"\n    id: Mapped[int] = mapped_column(primary_key=True)\n    title: Mapped[str]\n    author: Mapped[str]\n\n\nBase.metadata.create_all(engine)\n\n# Sample data (don\'t change)\nwith Session(engine) as session:\n    session.add_all([Book(title="Malgudi Days", author="R. K. Narayan"), Book(title="Wings of Fire", author="A. P. J. Abdul Kalam")])\n    session.commit()\n\napp = FastAPI()\n\n# Your endpoint here\n',
    solution: 'from fastapi import FastAPI, HTTPException\nfrom sqlalchemy import create_engine\nfrom sqlalchemy.orm import DeclarativeBase, Mapped, mapped_column, Session\n\nengine = create_engine("sqlite:///library.db")\n\n\nclass Base(DeclarativeBase):\n    pass\n\n\nclass Book(Base):\n    __tablename__ = "books"\n    id: Mapped[int] = mapped_column(primary_key=True)\n    title: Mapped[str]\n    author: Mapped[str]\n\n\nBase.metadata.create_all(engine)\n\n# Sample data (don\'t change)\nwith Session(engine) as session:\n    session.add_all([Book(title="Malgudi Days", author="R. K. Narayan"), Book(title="Wings of Fire", author="A. P. J. Abdul Kalam")])\n    session.commit()\n\napp = FastAPI()\n\n\n@app.get("/books/{book_id}")\ndef get_book(book_id: int):\n    with Session(engine) as session:\n        book = session.get(Book, book_id)\n        if book is None:\n            raise HTTPException(status_code=404, detail="Book not found")\n        return {"id": book.id, "title": book.title, "author": book.author}\n',
    tests: [
      { name: "GET /books/2 → Wings of Fire", expr: get("/books/2", ".json()"), op: "equals", expected: '{"id": 2, "title": "Wings of Fire", "author": "A. P. J. Abdul Kalam"}', msg: "It gave {got}" },
      { name: "GET /books/7 → 404 Book not found", expr: `(lambda r: (r.status_code, r.json()))(${get("/books/7")})`, op: "equals", expected: '(404, {"detail": "Book not found"})', msg: "It gave {got}" },
    ],
    why: "Open a session, `session.get(Book, book_id)`, and build the reply **inside** the `with` block, while the session is still open." },

// ═══ js/questions/50-sqlalchemy.js ═══
// ═════════ SQLAlchemy & sessions (the class format: Session(engine) … close(), results as dictionaries) ═════════
NOTES.sqlalchemy = `## SQLAlchemy: models and sessions

### Setting up (database.py / models)
\`\`\`python
from sqlalchemy import create_engine, Column, Integer, String
from sqlalchemy.orm import declarative_base, Session

engine = create_engine("sqlite:///items.db")     # where the database is
Base = declarative_base()                         # every model inherits from Base


class Item(Base):
    __tablename__ = "items"                       # the table's name in the database
    id = Column(Integer, primary_key=True)        # unique; the database numbers it 1, 2, 3…
    name = Column(String)
    description = Column(String)
    location = Column(String)
    status = Column(String)


Base.metadata.create_all(engine)                 # make the tables that don't exist yet
\`\`\`
- **engine**: how to reach the database. **model** (class): one table; one object = one row.
- Every model needs \`__tablename__\` and a **primary key**. Forgot \`create_all\`? → **no such table: items**.

### CREATE
\`\`\`python
def create_item(name, description, location, status):
    session = Session(engine)
    item = Item(
        name=name,
        description=description,
        location=location,
        status=status
    )

    session.add(item)          # put it in the session
    session.commit()           # save it: now it has an id
    session.refresh(item)      # load the saved values (the new id) from the database

    result = {
        "id": item.id,
        "name": item.name,
        "description": item.description,
        "location": item.location,
        "status": item.status
    }

    session.close()
    return result
\`\`\`

### READ ALL
\`\`\`python
def get_all_items():
    session = Session(engine)

    items = session.query(Item).all()          # a list of Item objects

    result = []

    for item in items:
        result.append({
            "id": item.id,
            "name": item.name,
            "description": item.description,
            "location": item.location,
            "status": item.status
        })

    session.close()
    return result
\`\`\`
- Only some rows: \`session.query(Item).filter_by(status="lost").all()\`. One or none: \`.first()\`. How many: \`.count()\`.

### READ ONE
\`\`\`python
def get_item(item_id):
    session = Session(engine)

    item = session.get(Item, item_id)          # the Item, or None

    if item is None:
        session.close()
        return None

    result = {
        "id": item.id,
        "name": item.name,
        "description": item.description,
        "location": item.location,
        "status": item.status
    }

    session.close()
    return result
\`\`\`

### UPDATE and DELETE
\`\`\`python
item = session.get(Item, item_id)    # (check for None as above)
item.status = status                 # change the attribute…
session.commit()                     # …and save it
session.refresh(item)

session.delete(item)                 # delete needs the OBJECT, not the id
session.commit()
\`\`\`

### Rules
- Nothing is saved until **commit**. Closing without committing throws the changes away.
- Build the dictionary **before** \`session.close()\`. After a commit, the item reloads its values from the database on the next read; once the session is closed it can't → **DetachedInstanceError**. (\`refresh\` reloads them straight after the commit.)
- Give back dictionaries, not Item objects: FastAPI turns dictionaries into JSON.
- \`session.rollback()\` undoes everything since the last commit (use it after an error).

### Common errors
| Error | Usually means |
|---|---|
| no such table: items | \`Base.metadata.create_all(engine)\` is missing |
| could not assemble any primary key columns | no \`primary_key=True\` in the model |
| 'NoneType' object has no attribute 'id' | \`session.get\` gave None: check \`if item is None\` |
| Class 'builtins.int' is not mapped | \`session.delete(item_id)\`: give it the object |
| 'method' object is not iterable | \`.all\` without brackets: \`.all()\` |
| 'Item' object is not iterable | \`.first()\` gives one item; use \`.all()\` for a list |
| DetachedInstanceError | the item was read after \`session.close()\` (after a commit) |
| Instance … is not persistent within this Session | \`session.add(item)\` is missing before commit/refresh |
`;

const DB_MODEL = `from sqlalchemy import create_engine, Column, Integer, String

`;

    why: "`add` only puts the object in the session. `commit()` writes it to the database. Closing without committing throws it away." },
  { id: "db-m7", type: "mcq", title: "Why refresh?",

    why: "The commit gives the row its id in the database; `refresh` loads the saved values (including the id) back into the object, ready to put in the dictionary." },

// ═══ js/30-api-docs.js ═══
// ───── API docs: a page like FastAPI's /docs (Swagger UI) for the student's own app ─────
// apiDocs() starts the app once (like `uvicorn main:app --reload`); every Execute sends a request to that
// same running app, so a POST is visible to a later GET. "Restart app" runs the code again.
const API_BASE = "http://127.0.0.1:8000";
const STATUS_TEXT = { 200: "OK", 201: "Created", 204: "No Content", 400: "Bad Request", 404: "Not Found", 405: "Method Not Allowed", 409: "Conflict", 422: "Unprocessable Content", 500: "Internal Server Error" };
const isApiQuestion = q => q.lang === "python" && (q.topic === "fastapi" || /FastAPI\s*\(/.test((q.starter || "") + (q.solution || "")));

function apiOperation(r, i) {
  const m = r.method.toLowerCase();
  const params = r.params.length ? `<table class="ad-params"><thead><tr><th>Name</th><th>Value</th></tr></thead><tbody>${r.params.map(p => `
      <tr><td><b>${esc(p.name)}</b>${p.required ? '<span class="ad-req">* required</span>' : ""}<div class="ad-type">${esc(p.type)}</div><div class="ad-in">(${p.in})</div></td>
      <td><input type="text" data-p="${esc(p.name)}" data-in="${p.in}" data-req="${p.required ? 1 : ""}" placeholder="${esc(p.default != null ? String(p.default) : p.name)}" aria-label="${esc(p.name)} (${p.in})"></td></tr>`).join("")}</tbody></table>`
    : `<p class="note">No parameters</p>`;
  const body = r.body ? `
    <h5>Request body ${r.body.required ? '<span class="ad-req">required</span>' : ""} <span class="ad-type">application/json</span></h5>
    <textarea rows="${Math.min(10, Object.keys(r.body.example).length + 2)}" spellcheck="false" data-body aria-label="Request body (JSON)">${esc(JSON.stringify(r.body.example, null, 2))}</textarea>
    <div class="ad-schema"><b>${esc(r.body.model)}</b> { ${r.body.fields.map(f => `<span>${esc(f.name)}${f.required ? "*" : ""}: <i>${esc(f.type)}</i></span>`).join(", ")} }</div>` : "";
  return `<details class="op op-${m}" data-op="${i}">
    <summary><span class="ad-m">${esc(r.method)}</span><span class="ad-path">${esc(r.path)}</span><span class="ad-sum">${esc(r.summary)}</span></summary>
    <div class="op-body">
      <h5>Parameters</h5>${params}${body}
      <div class="actions"><button class="btn small" type="button" data-exec>Execute</button><button class="btn ghost small" type="button" data-clear hidden>Clear</button></div>
      <div class="ad-resp" aria-live="polite"></div>
    </div>
  </details>`;
}

function curlFor(method, url, body) {
  let c = `curl -X '${method}' \\\n  '${url}' \\\n  -H 'accept: application/json'`;
  if (body != null) c += ` \\\n  -H 'Content-Type: application/json' \\\n  -d '${body.replace(/'/g, "'\\''")}'`;
  return c;
}

async function renderApiDocs(host, q, code, onLoading) {
  host.innerHTML = `<p class="note">Starting your app…</p>`;
  let d;
  try { d = await apiDocs(q, code, onLoading); }
  catch (e) { host.innerHTML = `<p class="ad-err">${esc(e.message)}</p>`; return; }
  if (d.error) { host.innerHTML = `<p class="ad-err">The app didn’t start:\n${esc(d.error)}</p><p class="note">Fix the code, then press “Restart app”.</p>`; return; }
  host.innerHTML = `
    <div class="ad-head"><div><b>${esc(d.title || "FastAPI")}</b> <span class="ad-badge">OAS 3.1</span><div class="note">Like <code>${API_BASE}/docs</code>. Requests go to your code right here: no server needed.</div></div></div>
    ${d.printed ? `<pre class="ad-printed" aria-label="Printed when the app started">${esc(d.printed)}</pre>` : ""}
    ${d.routes.length ? d.routes.map(apiOperation).join("") : `<p class="note">The app has no endpoints yet. Add one with <code>@app.get("/...")</code>.</p>`}`;
  host.querySelectorAll("details.op").forEach(op => {
    const r = d.routes[Number(op.dataset.op)], out = op.querySelector(".ad-resp");
    op.querySelector("[data-clear]").addEventListener("click", e => { out.innerHTML = ""; e.currentTarget.hidden = true; });
    op.querySelector("[data-exec]").addEventListener("click", async e => {
      const btn = e.currentTarget; btn.disabled = true;
      let path = r.path; const query = new URLSearchParams(); const missing = [];
      op.querySelectorAll("[data-p]").forEach(inp => {
        const v = inp.value.trim();
        inp.classList.toggle("ad-missing", !v && !!inp.dataset.req);
        if (!v) { if (inp.dataset.req) missing.push(inp.dataset.p); return; }
        if (inp.dataset.in === "path") path = path.replace(new RegExp(`\\{${inp.dataset.p}(:[^}]*)?\\}`), encodeURIComponent(v));
        else query.append(inp.dataset.p, v);
      });
      if (missing.length) { out.innerHTML = `<p class="ad-err">Required field is not provided: ${esc(missing.join(", "))}</p>`; btn.disabled = false; return; }
      const url = path + (query.toString() ? "?" + query : "");
      const bodyText = op.querySelector("[data-body]")?.value ?? null;
      out.innerHTML = `<p class="note">Sending…</p>`;
      let res;
      try { res = await apiCall(r.method, url, bodyText); }
      catch (err) { out.innerHTML = `<p class="ad-err">${esc(err.message)}</p>`; btn.disabled = false; return; }
      if (res.error) { out.innerHTML = `<p class="ad-err">${esc(res.error)}</p>`; btn.disabled = false; return; }
      const ok = res.status < 300;
      out.innerHTML = `
        <h5>Curl</h5><pre class="ad-pre">${esc(curlFor(r.method, API_BASE + url, bodyText))}</pre>
        <h5>Request URL</h5><pre class="ad-pre">${esc(API_BASE + url)}</pre>
        <h5>Server response</h5>
        <table class="ad-params"><thead><tr><th>Code</th><th>Details</th></tr></thead><tbody><tr>
          <td><b class="${ok ? "ad-ok" : "ad-bad"}">${res.status}</b><div class="note">${esc(STATUS_TEXT[res.status] || "")}</div></td>
          <td><div class="ad-type">Response body</div><pre class="ad-pre">${esc(typeof res.body === "string" ? res.body : JSON.stringify(res.body, null, 2))}</pre></td>
        </tr></tbody></table>
        ${res.crash ? `<p class="ad-err">In the terminal running uvicorn you would see the error:\n${esc(res.crash)}</p>` : ""}
        ${res.printed ? `<div class="ad-type">Printed in the terminal:</div><pre class="ad-printed">${esc(res.printed)}</pre>` : ""}`;
      op.querySelector("[data-clear]").hidden = false;
      btn.disabled = false;
    });
  });
}

// ───── the practice page ─────
const STORE_KEY = "practice-progress-v1";
const DEFAULT_FILTERS = () => ({ topics: TOPICS.map(t => t.id), types: TYPES.map(t => t.id), status: "all", search: "" });
let P = { q: {}, f: DEFAULT_FILTERS() };
try {
  const saved = JSON.parse(localStorage.getItem(STORE_KEY) || "null");
  if (saved && saved.q) P = { q: saved.q, f: { ...DEFAULT_FILTERS(), ...(saved.f || {}) } };
} catch {}
const save = debounce(() => { try { localStorage.setItem(STORE_KEY, JSON.stringify(P)); } catch {} }, 300);

// Order: topic, then type (multiple choice, blanks, write, debug); within that, the order they were added.
{
  const rank = (list, id) => list.findIndex(x => x.id === id);
  BANK.sort((a, b) => rank(TOPICS, a.topic) - rank(TOPICS, b.topic) || rank(TYPES, a.type) - rank(TYPES, b.type));
}
const byId = new Map(BANK.map(q => [q.id, q]));
const topicOf = id => TOPICS.find(t => t.id === id) || { name: id, color: "var(--muted)" };
const typeOf = id => TYPES.find(t => t.id === id) || { name: id, short: id };
const statusOf = q => (P.q[q.id] && P.q[q.id].s) || "";
const record = (q, ok) => {
  const e = (P.q[q.id] ||= {});
  if (ok) e.s = "c"; else if (e.s !== "c") e.s = "w";
  save(); renderSide();
};
const normBlank = s => String(s).replace(/[“”]/g, '"').replace(/[‘’]/g, "'").replace(/'/g, '"').replace(/\s+/g, "").replace(/;+$/, "");

function filtered() {
  const f = P.f, s = f.search.trim().toLowerCase();
  return BANK.filter(q => f.topics.includes(q.topic) && f.types.includes(q.type)
    && (f.status === "all" || (f.status === "new" ? !statusOf(q) : statusOf(q) === f.status))
    && (!s || (q.title + " " + q.q + " " + (q.code || "")).toLowerCase().includes(s)));
}

/* ───────── side: filters and the question list ───────── */
function renderSide() {
  const f = P.f, all = BANK;
  const nm = location.hash.match(/^#notes(?:\/([^/]+))?/);
  el("notesNav").innerHTML = TOPICS.map(t => `<li><a href="#notes/${t.id}"${nm && nm[1] === t.id ? ' aria-current="page"' : ""}><span class="dot" style="background:${t.color}"></span>${esc(t.name)}</a></li>`).join("");

  el("overallText").textContent = `${done} of ${all.length} correct`;
  el("overallBar").style.width = (all.length ? (done / all.length) * 100 : 0) + "%";

  el("topics").innerHTML = TOPICS.map(t => {

  if (el("search").value !== f.search) el("search").value = f.search;

function setFilter(change) {
  Object.assign(P.f, change);
  save(); renderSide();
}

function wireSide() {
  el("topics").addEventListener("click", e => {
    const b = e.target.closest("[data-topic]"); if (!b) return;
    const id = b.dataset.topic, on = P.f.topics.includes(id);
    if (e.shiftKey || e.altKey) return setFilter({ topics: [id] });
    const topics = on ? P.f.topics.filter(x => x !== id) : [...P.f.topics, id];
    setFilter({ topics: topics.length ? topics : [id] });
  });
  el("types").addEventListener("click", e => {
    const b = e.target.closest("[data-type]"); if (!b) return;
    const id = b.dataset.type, on = P.f.types.includes(id);
    const types = on ? P.f.types.filter(x => x !== id) : [...P.f.types, id];
    setFilter({ types: types.length ? types : [id] });
  });
  el("status").addEventListener("click", e => { const b = e.target.closest("[data-status]"); if (b) setFilter({ status: b.dataset.status }); });
  el("search").addEventListener("input", debounce(e => setFilter({ search: e.target.value }), 200));
  el("allTopics").addEventListener("click", () => setFilter({ topics: TOPICS.map(t => t.id), types: TYPES.map(t => t.id), status: "all", search: "" }));
  el("qlist").addEventListener("click", e => { const b = e.target.closest("[data-q]"); if (b) go("q/" + b.dataset.q); });
  el("randomBtn").addEventListener("click", () => {
    const list = filtered(), fresh = list.filter(q => statusOf(q) !== "c"), pool = fresh.length ? fresh : list;

    go("q/" + pool[Math.floor(Math.random() * pool.length)].id);

/* ───────── routing ───────── */
const currentId = () => (location.hash.match(/^#q\/(.+)$/) || [])[1] ? decodeURIComponent(location.hash.slice(3)) : null;
const go = h => { if (location.hash === "#" + h) route(); else location.hash = h; };
let cleanupView = null;
function route() {
  if (cleanupView) { try { cleanupView(); } catch {} cleanupView = null; }
  const h = location.hash.replace(/^#/, "");
  const main = el("main");
  const notesMatch = h.match(/^notes(?:\/([^/]+))?(?:\/(.+))?$/);
  let target = null;
  if (h.startsWith("q/") && byId.has(decodeURIComponent(h.slice(2)))) renderQuestion(main, byId.get(decodeURIComponent(h.slice(2))));
  else if (notesMatch && notesMatch[1] && NOTES[notesMatch[1]]) target = renderNotes(main, notesMatch[1], notesMatch[2]);
  else if (notesMatch && !notesMatch[1]) renderNotesIndex(main);
  else renderWelcome(main);

  if (target) { target.scrollIntoView({ block: "start" }); scrollBy({ top: -80 }); target.focus({ preventScroll: true }); target.classList.add("flash"); }
  else scrollTo({ top: 0 });
}

function neighbours(id) {
  const list = filtered(), i = list.findIndex(q => q.id === id);
  return { list, i, prev: i > 0 ? list[i - 1] : null, next: i >= 0 ? list[i + 1] || null : list[0] || null };

function renderWelcome(main) {
  const n = t => BANK.filter(q => q.topic === t).length;
  const okN = t => BANK.filter(q => q.topic === t && statusOf(q) === "c").length;
  const byType = TYPES.map(t => `${BANK.filter(q => q.type === t.id).length} ${t.name.toLowerCase()}`).join(" · ");
  main.innerHTML = `<article class="card welcome">
    <h2 style="margin-top:0">Practise for the exam</h2>
    <p>${BANK.length} questions on JavaScript, React, the terminal, FastAPI and SQLAlchemy: ${byType}. Every answer comes with an explanation, and code questions run right here in the browser.</p>
    <div class="stats">${TOPICS.map(t => `<button class="stat" type="button" data-start="${t.id}"><b style="color:${t.color}">${esc(t.name)}</b><span>${n(t.id)} questions · ${okN(t.id)} correct</span><span class="bar"><i style="width:${n(t.id) ? okN(t.id) / n(t.id) * 100 : 0}%;background:${t.color}"></i></span></button>`).join("")}</div>
    <h3>How to use it</h3>
    <ul>
      <li><b>Pick topics and question types</b> on the left. Click a topic to switch it on or off (Shift + click shows only that topic).</li>
      <li><b>Read the study notes</b> for a topic first: <span class="row" style="display:inline-flex">${TOPICS.map(t => `<a href="#notes/${t.id}">${esc(t.name)}</a>`).join(" · ")}</span></li>
      <li><b>Answer, then read the explanation</b>, even when you got it right. “Try again” lets you redo any question.</li>
      <li><b>Code questions</b>: Run shows what your code does; Check runs the tests. <span class="kbd">Ctrl</span> + <span class="kbd">Enter</span> checks too.</li>
      <li><b>Before the exam</b>: set Status to “Got wrong” and redo those until they’re all green.</li>
      <li>Your progress is saved in this browser only.</li>
    </ul>
    <div class="actions"><button class="btn" type="button" data-begin>Start practising</button><button class="btn ghost" type="button" data-random>Random question</button></div>
  </article>`;
  main.querySelectorAll("[data-start]").forEach(b => b.addEventListener("click", () => { setFilter({ topics: [b.dataset.start] }); const f = filtered()[0]; if (f) go("q/" + f.id); }));
  main.querySelector("[data-begin]").addEventListener("click", () => { const list = filtered(); const f = list.find(q => !statusOf(q)) || list[0]; if (f) go("q/" + f.id); });
  main.querySelector("[data-random]").addEventListener("click", () => el("randomBtn").click());
}

// ───── study notes: one page per topic, with a link to every section ─────
const slug = text => String(text).toLowerCase().replace(/<[^>]+>/g, "").replace(/&[a-z]+;/g, "").replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
const notesSections = topic => (NOTES[topic].match(/^### .+$/gm) || []).map(l => l.slice(4).trim());
const notesHref = (topic, heading) => `#notes/${topic}` + (heading ? "/" + slug(heading) : "");
const notesTabs = current => `<nav class="notes-tabs" aria-label="Study notes topics">${TOPICS.map(t =>
  `<a href="#notes/${t.id}"${t.id === current ? ' aria-current="page"' : ""}><span class="dot" style="background:${t.color}"></span>${esc(t.name)}</a>`).join("")}</nav>`;

function renderNotes(main, topic, sectionSlug) {
  const t = topicOf(topic), sections = notesSections(topic);
  const count = h => BANK.filter(q => q.topic === topic && noteSection(q) === h).length;
  main.innerHTML = `<article class="card notes">
    ${notesTabs(topic)}
    <div class="qhead"><span class="tag"><span class="dot" style="background:${t.color}"></span>${esc(t.name)}</span><span>Study notes</span></div>
    <nav class="toc" aria-label="On this page"><h3>On this page</h3><ol>${sections.map(h =>
      `<li><a href="${notesHref(topic, h)}">${inline(h)}</a>${count(h) ? ` <span class="note">· ${count(h)} question${count(h) === 1 ? "" : "s"}</span>` : ""}</li>`).join("")}</ol></nav>
    <div class="prompt" data-notes>${markdown(NOTES[topic])}</div>
    <div class="actions"><button class="btn" type="button" data-practise>Practise ${esc(t.name)}</button><a class="btn ghost" href="#notes">All notes</a></div>
  </article>`;
  // Give each section heading an id, a link back to the contents, and a link to its questions.
  main.querySelectorAll("[data-notes] h3").forEach(h3 => {
    const heading = sections.find(s => slug(s) === slug(h3.textContent)) || h3.textContent;
    h3.id = "n-" + slug(heading); h3.tabIndex = -1;
    const n = count(heading);
    h3.insertAdjacentHTML("beforeend", ` <a class="sec-link" href="${notesHref(topic, heading)}" aria-label="Link to ${esc(h3.textContent)}">#</a>`);
    if (n) {
      const qs = BANK.filter(q => q.topic === topic && noteSection(q) === heading);
      h3.insertAdjacentHTML("afterend", `<details class="sec-q"><summary>${n} question${n === 1 ? "" : "s"} on this</summary><ul>${qs.map(q => {
        const st = statusOf(q);
        return `<li><a href="#q/${encodeURIComponent(q.id)}">${esc(q.title)}</a> <span class="note">${esc(typeOf(q.type).short)}${st === "c" ? " · ✓" : st === "w" ? " · not yet right" : ""}</span></li>`;
      }).join("")}</ul></details>`);
    }
  });
  main.querySelector("[data-practise]").addEventListener("click", () => { setFilter({ topics: [topic] }); const f = filtered()[0]; if (f) go("q/" + f.id); });
  return sectionSlug ? main.querySelector("#n-" + CSS.escape(sectionSlug)) : null;
}

function renderNotesIndex(main) {
  main.innerHTML = `<article class="card notes">
    ${notesTabs(null)}
    <h2 style="margin-top:6px">Study notes</h2>
    <p>Everything the questions ask about, topic by topic. Each question also links to the section it tests.</p>
    <div class="notes-index">${TOPICS.map(t => `<section aria-labelledby="ni-${t.id}">
      <h3 id="ni-${t.id}"><a href="#notes/${t.id}"><span class="dot" style="background:${t.color}"></span>${esc(t.name)}</a></h3>
      <ul>${notesSections(t.id).map(h => `<li><a href="${notesHref(t.id, h)}">${inline(h)}</a></li>`).join("")}</ul>
    </section>`).join("")}</div>
  </article>`;
}

/* ───────── a question ───────── */
function renderQuestion(main, q) {
  const t = topicOf(q.topic), ty = typeOf(q.type), st = statusOf(q);
  const nb = neighbours(q.id);
  main.innerHTML = `<article class="card" id="qcard">
    <div class="qhead">
      <span class="tag"><span class="dot" style="background:${t.color}"></span>${esc(t.name)}</span><span class="tag">${esc(ty.name)}</span>
      ${nb.i >= 0 ? `<span>${nb.i + 1} of ${nb.list.length}</span>` : `<span>Not in the current filter</span>`}
      <span data-status>${st === "c" ? `<span class="tag c">✓ Correct</span>` : st === "w" ? `<span class="tag w">Not yet right</span>` : ""}</span>
    </div>
    <h2>${esc(q.title)}</h2>
    <div class="prompt">${markdown(q.q)}</div>
    <div data-body></div>
    <div class="hintbox" data-hint></div>
    <div data-result></div>
    <div class="qnav">
      <button class="btn ghost" type="button" data-prev ${nb.prev ? "" : "disabled"}>← ${nb.prev ? "Previous" : "First question"}</button>
      <a class="linkbtn" href="${notesHref(q.topic, noteSection(q))}" style="align-self:center">📖 Notes: ${inline(noteSection(q) || t.name)}</a>
      <button class="btn ghost" type="button" data-next ${nb.next ? "" : "disabled"}>${nb.next ? "Next" : "Last question"} →</button>
    </div>
  </article>`;
  const $q = s => main.querySelector(s);
  $q("[data-prev]").addEventListener("click", () => nb.prev && go("q/" + nb.prev.id));
  $q("[data-next]").addEventListener("click", () => nb.next && go("q/" + nb.next.id));
  if (q.hint) {
    const hb = $q("[data-hint]");
    hb.innerHTML = `<button class="hintbtn" type="button">Show a hint</button>`;
    hb.querySelector("button").addEventListener("click", () => { hb.innerHTML = `<div class="hinttext"><b>Hint.</b> ${inline(q.hint)}</div>`; });
  }
  const ctx = {
    q, body: $q("[data-body]"), resultBox: $q("[data-result]"),
    setStatus: ok => {
      record(q, ok);
      const s = statusOf(q);
      $q("[data-status]").innerHTML = s === "c" ? `<span class="tag c">✓ Correct</span>` : s === "w" ? `<span class="tag w">Not yet right</span>` : "";
    },
    result: (kind, title, extra = "") => {
      const sec = noteSection(q);
      ctx.resultBox.innerHTML = `<div class="result ${kind}"><b>${title}</b>${extra}${q.why ? `<div class="prompt" style="margin-top:6px">${markdown(q.why)}</div>` : ""}${sec ? `<p class="more">Read more in the notes: <a href="${notesHref(q.topic, sec)}">${esc(topicOf(q.topic).name)} → ${inline(sec)}</a></p>` : ""}</div>`;
    },
    next: nb.next,
  };
  if (q.type === "mcq") mcqView(ctx);
  else if (q.type === "blank") blankView(ctx);
  else cleanupView = codeView(ctx);
}

const LETTERS = "ABCDEFGH";
function mcqView(ctx) {
  const { q, body } = ctx;
  let picked = null, locked = false;
  // Show the options in a new random order each time the question opens, so position never gives the answer away.
  const order = q.opts.map((_, i) => i);
  for (let i = order.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [order[i], order[j]] = [order[j], order[i]]; }
  const letterOf = i => LETTERS[order.indexOf(i)];
  const draw = (reveal = false) => {
    body.innerHTML = (q.code ? `<pre class="show">${highlight(q.code, q.codeLang || "js")}</pre>` : "") +
      `<div class="opts" role="group" aria-label="Options">${order.map((i, pos) => {
        const o = q.opts[i];
        let cls = "opt";
        if (locked || reveal) { if (i === q.a) cls += " right"; else if (i === picked) cls += " wrong"; }
        return `<button class="${cls}" type="button" data-i="${i}" aria-pressed="${picked === i}" ${locked || reveal ? "disabled" : ""}><span class="l">${LETTERS[pos]}</span><span class="x">${inline(o)}</span></button>`;
      }).join("")}</div>
      <div class="actions">
        ${locked || reveal ? `<button class="btn ghost" type="button" data-retry>Try again</button>${ctx.next ? `<button class="btn" type="button" data-go>Next question →</button>` : ""}`
          : `<button class="btn" type="button" data-check ${picked == null ? "disabled" : ""}>Check answer</button><button class="btn ghost" type="button" data-show>Show answer</button>`}
      </div>`;
    body.querySelectorAll(".opt").forEach(b => b.addEventListener("click", () => { picked = Number(b.dataset.i); draw(); }));
    body.querySelector("[data-check]")?.addEventListener("click", () => {
      locked = true; const ok = picked === q.a;
      ctx.setStatus(ok);
      ctx.result(ok ? "good" : "bad", ok ? "Correct!" : `Not quite. The answer is ${letterOf(q.a)}.`);
      draw();
    });
    body.querySelector("[data-show]")?.addEventListener("click", () => { ctx.result("info", `The answer is ${letterOf(q.a)}.`); draw(true); });
    body.querySelector("[data-retry]")?.addEventListener("click", () => { picked = null; locked = false; ctx.resultBox.innerHTML = ""; draw(); });
    body.querySelector("[data-go]")?.addEventListener("click", () => go("q/" + ctx.next.id));
  };
  draw();
}

function blankView(ctx) {
  const { q, body } = ctx;
  const parts = q.code.split(/__(\d+)__/), n = (parts.length - 1) / 2;
  let vals = Array(n).fill(""), marks = null;
  const judge = () => {
    const norm = vals.map(normBlank);
    if (!q.anyOrder) return norm.map((v, i) => (q.acc[i] || []).some(a => normBlank(a) === v));
    return norm.map((v, i) => q.acc.some(list => list.some(a => normBlank(a) === v)) && norm.indexOf(v) === i);
  };
  const draw = () => {
    let html = "";
    parts.forEach((p, i) => {
      if (i % 2 === 0) { html += highlight(p, q.lang || "js"); return; }
      const k = (i - 1) / 2, cls = marks ? (marks[k] ? "ok" : "no") : "";
      html += `<span class="num">${p}</span><input data-k="${k}" class="${cls}" value="${esc(vals[k])}" aria-label="Blank ${p}" spellcheck="false" autocapitalize="off" autocomplete="off" ${marks ? "disabled" : ""} style="width:${Math.max(7, vals[k].length + 2)}ch">`;
    });
    body.innerHTML = `<pre class="show blanks">${html}</pre>
      <div class="actions">${marks ? `<button class="btn ghost" type="button" data-retry>Try again</button>${ctx.next ? `<button class="btn" type="button" data-go>Next question →</button>` : ""}`
        : `<button class="btn" type="button" data-check>Check answers</button><button class="btn ghost" type="button" data-show>Show answer</button><span class="note">Spaces don’t matter. Capitals do.</span>`}</div>`;
    body.querySelectorAll("input").forEach(inp => {
      inp.addEventListener("input", () => { vals[Number(inp.dataset.k)] = inp.value; inp.style.width = Math.max(7, inp.value.length + 2) + "ch"; });
      inp.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); body.querySelector("[data-check]")?.click(); } });
    });
    body.querySelector("[data-check]")?.addEventListener("click", () => {
      if (vals.some(v => !v.trim())) { toast("Fill in every blank first."); return; }
      marks = judge(); const ok = marks.every(Boolean);
      ctx.setStatus(ok);
      ctx.result(ok ? "good" : "bad", ok ? "All right!" : `${marks.filter(Boolean).length} of ${n} right.`,
        ok ? "" : `<p>Accepted: ${q.acc.map((a, i) => `<b>${i + 1}</b> <code>${esc(a.join("  or  "))}</code>`).join(" · ")}</p>`);
      draw();
    });
    body.querySelector("[data-show]")?.addEventListener("click", () => {
      vals = q.acc.map(a => a[0]); marks = vals.map(() => true);
      ctx.result("info", "The answers are filled in.", q.acc.some(a => a.length > 1) ? `<p>Also accepted: ${q.acc.map((a, i) => a.length > 1 ? `<b>${i + 1}</b> <code>${esc(a.slice(1).join("  or  "))}</code>` : "").filter(Boolean).join(" · ")}</p>` : "");
      draw();
    });
    body.querySelector("[data-retry]")?.addEventListener("click", () => { marks = null; ctx.resultBox.innerHTML = ""; draw(); body.querySelector("input")?.focus(); });
    body.querySelector("[data-go]")?.addEventListener("click", () => go("q/" + ctx.next.id));
  };
  draw();
}

function codeView(ctx) {
  const { q, body } = ctx;
  const entry = (P.q[q.id] ||= {});
  const react = q.lang === "react", term = q.lang === "terminal", py = q.lang === "python";
  const names = checkNames(q);
  const height = Math.max(220, Math.min(460, (String(entry.code ?? q.starter).split("\n").length + 3) * 22.4 + 28));
  body.innerHTML = `
    <div class="bench">
      <div data-ed></div>
      ${py && q.stdin != null ? `<details class="stdin" open><summary>Input for <code>input()</code></summary><textarea rows="2" spellcheck="false">${esc(q.stdin)}</textarea></details>` : ""}
      <div class="actions">
        <button class="btn ghost" type="button" data-run>Run</button>
        <button class="btn" type="button" data-check>Check my code</button>
        <button class="btn ghost" type="button" data-reset>Start over</button>
        <button class="btn ghost" type="button" data-sol>Show solution</button>
        ${isApiQuestion(q) ? `<button class="btn ghost" type="button" data-docs aria-expanded="false">API docs (/docs)</button>` : ""}
        <span class="note">${term ? "One command per line." : "Ctrl + Enter checks."}</span>
      </div>
      <div class="panes ${react ? "two" : ""}">
        ${react ? `<div class="pane"><h4>Preview</h4><div class="preview"></div></div>` : ""}
        <div class="pane"><h4>${term ? "Terminal" : "Console"}</h4><div class="console" aria-live="polite"></div></div>
      </div>
      ${isApiQuestion(q) ? `<div class="pane" data-docs-pane hidden><h4><span>API docs · like ${API_BASE}/docs</span><button class="btn ghost small" type="button" data-docs-restart>Restart app</button></h4><div class="apidocs"></div></div>` : ""}
      <div class="pane"><h4>Checks</h4><ul class="checks">${names.map(nm => `<li class="wait"><span class="i">○</span><span>${esc(nm)}</span></li>`).join("")}</ul></div>
      <div class="solution" data-solution hidden></div>
    </div>`;
  const con = body.querySelector(".console"), preview = body.querySelector(".preview"), stdin = body.querySelector(".stdin textarea");
  const log = (kind, text) => { const d = document.createElement("div"); d.className = kind === "log" ? "" : kind; d.textContent = text; con.append(d); con.scrollTop = con.scrollHeight; };
  const onLoading = () => log("info", "Loading Python… (the first time takes a few seconds)");
  const saveCode = debounce(v => { entry.code = v; save(); }, 400);
  const ed = createEditor(body.querySelector("[data-ed]"), {
    value: entry.code ?? q.starter, lang: q.lang, label: `Code for ${q.title}`, height,
    onChange: saveCode, onCtrlEnter: () => check(),
  });
  log("info", term ? "Press Run to play your commands in the practice terminal. Check tests them."
    : react ? "Run shows your component in the Preview. Check runs the tests."
    : py ? "Run shows what your program prints. Check runs the tests."
    : "Run shows your console.log output. Check runs the tests.");
  if (py) pyWarm()?.catch(() => {});

  const run = async quiet => {
    if (!quiet) { con.innerHTML = ""; }
    await runCode(q, ed.value, { log, previewHost: preview, stdin: stdin ? stdin.value : undefined, onLoading });
  };
  let busy = false;
  const check = async () => {
    if (busy) return; busy = true;
    const btn = body.querySelector("[data-check]"); btn.disabled = true;
    const list = body.querySelectorAll(".checks li");
    list.forEach(li => { li.className = "wait"; li.firstElementChild.textContent = "…"; li.querySelector(".why")?.remove(); });
    entry.code = ed.value; save();
    const res = await checkCode(q, ed.value, { onLoading: () => { con.innerHTML = ""; onLoading(); } });
    res.forEach((r, i) => {
      const li = list[i]; if (!li) return;
      li.className = r.pass ? "pass" : "fail"; li.firstElementChild.textContent = r.pass ? "✓" : "✗";
      if (!r.pass && r.why) { const w = document.createElement("span"); w.className = "why"; w.textContent = r.why; li.lastElementChild.append(w); }
    });
    const passed = res.filter(r => r.pass).length, all = res.length > 0 && passed === res.length;
    ctx.setStatus(all);
    if (all) ctx.result("good", "All checks pass!", ctx.next ? "" : "");
    else { ctx.resultBox.innerHTML = `<div class="result bad"><b>${passed} of ${res.length} checks pass.</b><p>Read the red lines under Checks, change your code, and check again.</p></div>`; }
    if (react) run(true);
    btn.disabled = false; busy = false;
  };
  body.querySelector("[data-run]").addEventListener("click", () => run(false));
  const docsBtn = body.querySelector("[data-docs]");
  if (docsBtn) {
    const pane = body.querySelector("[data-docs-pane]"), host = pane.querySelector(".apidocs");
    const start = () => renderApiDocs(host, q, ed.value, onLoading);
    docsBtn.addEventListener("click", () => {
      const open = pane.hidden;
      pane.hidden = !open; docsBtn.setAttribute("aria-expanded", String(open));
      docsBtn.textContent = open ? "Hide API docs" : "API docs (/docs)";
      if (open) { start(); pane.scrollIntoView({ block: "nearest", behavior: "smooth" }); }
    });
    pane.querySelector("[data-docs-restart]").addEventListener("click", start);
  }
  body.querySelector("[data-check]").addEventListener("click", check);
  body.querySelector("[data-reset]").addEventListener("click", e => confirmClick(e.currentTarget, () => { ed.value = q.starter; entry.code = q.starter; save(); }, "Click again to start over"));
  body.querySelector("[data-sol]").addEventListener("click", e => {
    const box = body.querySelector("[data-solution]");
    if (!box.hidden) { box.hidden = true; e.currentTarget.textContent = "Show solution"; return; }
    box.hidden = false; e.currentTarget.textContent = "Hide solution";
    box.innerHTML = `<div class="result info"><b>A solution</b>${q.why ? `<div class="prompt" style="margin-top:6px">${markdown(q.why)}</div>` : ""}</div>
      <pre class="show">${highlight(q.solution, q.lang === "react" ? "js" : q.lang === "terminal" ? "shell" : q.lang)}</pre>
      <button class="btn ghost small" type="button" data-use>Put this in the editor</button>`;
    box.querySelector("[data-use]").addEventListener("click", () => { ed.value = q.solution; entry.code = q.solution; save(); toast("The solution is in the editor. Press Check to see the tests pass."); });
  });
  if (react) run(true);
  return () => { if (react && typeof previewRoot !== "undefined" && previewRoot) { try { previewRoot.unmount(); } catch {} previewRoot = null; } };
}

/* ───────── start ───────── */
function boot() {
  wireSide();
  addEventListener("hashchange", route);
  // Links inside the page (href="#…") are handled here, so they also work when the page is shown inside a
  // sandboxed frame (like a preview), where the browser would otherwise resolve them against another address.
  document.addEventListener("click", e => {
    const a = e.target.closest && e.target.closest('a[href^="#"]');
    if (!a || e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
    e.preventDefault();
    go(a.getAttribute("href").slice(1));
  });
  addEventListener("keydown", e => {
    if (e.target.closest("input, textarea, select") || e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.key === "ArrowRight") main_click("[data-next]");
    if (e.key === "ArrowLeft") main_click("[data-prev]");
  });
  if (!window.React || !window.Babel) toast("Some parts didn’t load (React questions need the internet). Refresh to try again.");
  route();
}
const main_click = sel => { const b = el("main").querySelector(sel); if (b && !b.disabled) b.click(); };

// for automated checking of the question bank
window.__practice = { BANK, checkCode, runCode, termRun, go, noteSection, NOTES };
boot();

})();
